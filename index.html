<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plain Words">
<meta name="theme-color" content="#faf8f5">
<meta name="format-detection" content="telephone=no">
<title>Plain Words — 쉬운 단어로 말하기</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1c1a17; --dim:#6f6a62; --line:#e6e1d8;
  --accent:#1f6f5c; --accent-soft:#e6f0ec; --warn:#b4531f; --warn-soft:#fbeee5;
  --bad:#a33a3a; --good:#1f6f5c; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --r:14px;
}
html[data-theme="dark"]{
  --bg:#14150f; --card:#1c1e18; --ink:#eae7df; --dim:#9a958a; --line:#2e312a;
  --accent:#7fc9b0; --accent-soft:#1b2b25; --warn:#e0a06a; --warn-soft:#2e2519;
  --bad:#e08b8b; --good:#7fc9b0; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-size:17px; line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button,.mic,.wordchip,nav.tabs button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.serif{font-family:"Iowan Old Style","Apple Garamond",Georgia,"Nanum Myeongjo","Noto Serif KR",serif}
.wrap{max-width:780px;margin:0 auto;padding:0 20px calc(120px + env(safe-area-inset-bottom))}
header.top{
  position:sticky;top:0;z-index:20;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.top-in{max-width:780px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.brand{font-weight:600;letter-spacing:-.01em;font-size:16px;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:400;color:var(--dim);font-size:12px;letter-spacing:.02em}
.spacer{flex:1}
.iconbtn{
  border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:9px;
  width:32px;height:32px;display:grid;place-items:center;cursor:pointer;font-size:14px;
}
.iconbtn:hover{color:var(--ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 20px 0;max-width:780px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  border:0;background:transparent;color:var(--dim);font:inherit;font-size:14.5px;
  padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;
}
nav.tabs button:hover{color:var(--ink);background:var(--card)}
nav.tabs button.on{background:var(--ink);color:var(--bg)}
h1{font-size:26px;letter-spacing:-.02em;margin:28px 0 6px;font-weight:600}
h2{font-size:19px;margin:30px 0 10px;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;margin:20px 0 8px;font-weight:600;color:var(--dim);letter-spacing:.02em;text-transform:none}
p.lead{color:var(--dim);margin:0 0 18px;font-size:15.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin:14px 0}
.card.pad-lg{padding:28px}
.muted{color:var(--dim)}
.small{font-size:13.5px}
.tiny{font-size:12.5px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.grow{flex:1}
button.btn{
  font:inherit;font-size:15px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:9px 16px;cursor:pointer;transition:.12s;
}
button.btn:hover{border-color:var(--dim)}
button.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.btn.primary:hover{opacity:.88}
button.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
html[data-theme="dark"] button.btn.accent{color:#0f1410}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.btn.ghost{background:transparent}
button.btn.sm{font-size:13.5px;padding:6px 11px;border-radius:8px}
.kr-prompt{font-size:23px;line-height:1.5;letter-spacing:-.01em;margin:6px 0 4px}
.en-answer{font-size:21px;line-height:1.55}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.pill.grey{background:transparent;border-color:var(--line);color:var(--dim)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.warn > i{background:var(--warn)}
.mic{
  width:84px;height:84px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;font-size:30px;transition:.15s;margin:0 auto;
  box-shadow:var(--shadow);
}
.mic:hover{transform:translateY(-1px)}
.mic.rec{background:var(--accent);border-color:var(--accent);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}
.heard{
  min-height:52px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;
  font-size:17px;color:var(--ink);background:transparent;
}
.heard.empty{color:var(--dim);font-style:italic}
textarea,input[type=text]{
  font:inherit;width:100%;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;resize:vertical;
}
textarea:focus,input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.hit{color:var(--good);font-weight:600}
.miss{color:var(--bad);text-decoration:underline wavy var(--bad) 1px;text-underline-offset:3px}
.off-core{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.kr-prompt{font-size:20px}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:12.5px;color:var(--dim)}
.wordchip{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin:0 5px 6px 0;font-size:14.5px;cursor:pointer;background:var(--card)}
.wordchip:hover{border-color:var(--accent)}
.wordchip .k{color:var(--dim);font-size:12px;margin-left:5px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--card)}
summary{cursor:pointer;font-size:14.5px;color:var(--dim)}
details[open] summary{color:var(--ink);margin-bottom:8px}
.turn{padding:10px 0;border-bottom:1px solid var(--line)}
.turn:last-child{border-bottom:0}
.turn .who{font-size:12px;color:var(--dim);letter-spacing:.04em}
.turn.partner .en{font-size:18px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-size:14px;z-index:99;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.gatelist li{margin:6px 0}
.gatelist .ok::marker{color:var(--good)}
hr.sep{border:0;border-top:1px solid var(--line);margin:22px 0}
.fixedbar{
  position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:15;
  padding-bottom:env(safe-area-inset-bottom);
}
.mic{-webkit-touch-callout:none}
@media (hover:none){ .kbd{display:none} .hint-key{display:none} }
.fixedbar .in{max-width:780px;margin:0 auto;padding:10px 20px;display:flex;gap:10px;align-items:center}
code.inline{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13.5px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand serif">Plain Words <small id="stageBadge">1단계</small></div>
    <div class="spacer"></div>
    <div class="small muted" id="streakBadge"></div>
    <button class="iconbtn" id="themeBtn" title="화면 밝기">◐</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="wrap" id="view"></div>
<div class="toast" id="toast"></div>
<script>
/* ===== 학습 데이터 팩 (1단계) =====
   이 블록은 앱이 쓰는 유일한 데이터 형식입니다.
   다음 단계를 받으면 '다음 단계' 탭에서 JSON을 붙여넣어 추가합니다. */
const BUILTIN_PACKS = [
{
  "schema": "plainwords/v1",
  "stage": 1,
  "title": "막히지 않고 이어가기 — 300단어의 뼈대",
  "goal": "어려운 단어가 떠오르지 않아도 문장이 끊기지 않게 만든다. 쉬운 단어로 돌려 말하는 회로를 몸에 붙이는 단계.",
  "note": "일상 50 / 출판·문학 현장 50. 모든 모범 답안은 아래 core 목록 안의 단어로만 되어 있습니다.",
  "gate": {
    "patternMastery": 0.9,
    "paraphraseMastery": 0.85,
    "dialogueAll": true,
    "dialogueMinScore": 80,
    "topicsRequired": 6,
    "topicMinSeconds": 45,
    "topicMinWords": 55,
    "maxHintRate": 0.2,
    "minReviewStreak": 3
  },
  "core": [
    {"w":"be / is / are / was","kr":"이다, 있다","note":"모든 설명의 기본틀. It is / There is 로 시작하면 일단 문장이 나온다."},
    {"w":"have","kr":"가지다, 있다","note":"I have a question. / We have time. 소유가 아니어도 널리 쓴다."},
    {"w":"do","kr":"하다","note":"What do you do? / I didn't do it. 동사가 안 떠오르면 do + 명사."},
    {"w":"get","kr":"얻다, 되다, 도착하다","note":"만능. get an idea / get tired / get there. 어려운 동사의 90%를 대신한다."},
    {"w":"make","kr":"만들다, ~하게 하다","note":"make a decision(결정하다), make me sad(슬프게 하다). '동사'가 막히면 make + 명사."},
    {"w":"take","kr":"가지다, 걸리다, 데려가다","note":"It takes time. / take a walk / take a look."},
    {"w":"give","kr":"주다","note":"give an example / give me a minute."},
    {"w":"go / come","kr":"가다 / 오다","note":"go on(계속되다), come out(나오다·출간되다)."},
    {"w":"put","kr":"놓다, 두다","note":"put it in the book / put it another way(다르게 말하면)."},
    {"w":"say / tell / talk / ask","kr":"말하다 / 알려주다 / 이야기하다 / 묻다","note":"say + 말, tell + 사람, talk about + 주제, ask 사람 for 것."},
    {"w":"want / need","kr":"원하다 / 필요하다","note":"I want to say ... 로 시작하면 하고 싶은 말 대부분이 열린다."},
    {"w":"think / know / feel","kr":"생각하다 / 알다 / 느끼다","note":"I think ... 는 틀릴까 봐 두려울 때의 안전벨트."},
    {"w":"like","kr":"좋아하다 / ~같은","note":"둘 다 된다. It's like a dream. 돌려 말하기의 1번 도구."},
    {"w":"mean","kr":"의미하다","note":"I mean ... / What do you mean? 대화가 꼬일 때 되돌리는 손잡이."},
    {"w":"try / keep / start / stop","kr":"해보다 / 계속하다 / 시작하다 / 멈추다","note":"I'm trying to ... 는 실력을 넘어선 말을 할 때 쓰는 방패."},
    {"w":"work","kr":"일하다, 작품, 작동하다","note":"my work(내 작품) / it works(그게 잘 된다). 명사·동사 둘 다."},
    {"w":"write / read","kr":"쓰다 / 읽다","note":"a writer, a reader, writing, reading — 한 뿌리에서 네 단어."},
    {"w":"see / look / hear / find","kr":"보다 / 보이다 / 듣다 / 찾다","note":"I see.(알겠어요) 는 가장 값싼 맞장구."},
    {"w":"help / let / show / meet","kr":"돕다 / ~하게 두다 / 보여주다 / 만나다","note":"Let me think. / Let me try again."},
    {"w":"live / happen / change / stay","kr":"살다 / 일어나다 / 바뀌다 / 머무르다","note":"something that really happened(실제로 있었던 일)."},
    {"w":"thing / something / anything / nothing","kr":"것 / 무언가 / 아무거나 / 아무것도","note":"단어가 없으면 thing 으로 버틴다. the thing that ... 로 설명을 잇는다."},
    {"w":"people / person / someone / who","kr":"사람들 / 사람 / 누군가 / 누구","note":"the person who ... 는 직업·역할을 설명하는 만능 틀."},
    {"w":"time / day / year / moment","kr":"시간 / 날 / 해 / 순간","note":"the time when ... 로 시대·시점을 설명."},
    {"w":"way / kind / part / reason","kr":"방식 / 종류 / 부분 / 이유","note":"the way you write(당신이 쓰는 방식), a kind of ...(일종의)."},
    {"w":"word / line / page / name","kr":"단어 / 줄 / 쪽 / 이름","note":"in other words(다시 말해)."},
    {"w":"book / story / novel / chapter","kr":"책 / 이야기 / 소설 / 장","note":"작품 얘기의 기본 4단어."},
    {"w":"writer / reader / editor / translator","kr":"작가 / 독자 / 편집자 / 번역가","note":"모르는 직함은 the person who ... 로 풀면 된다."},
    {"w":"idea / question / answer / problem","kr":"생각 / 질문 / 답 / 문제","note":"That's a good question. 은 생각할 시간을 버는 문장."},
    {"w":"feeling / life / memory / dream","kr":"감정 / 삶 / 기억 / 꿈","note":"추상어는 대부분 이 넷 + 형용사로 풀린다."},
    {"w":"place / city / country / home","kr":"장소 / 도시 / 나라 / 집","note":""},
    {"w":"food / coffee / water / money","kr":"음식 / 커피 / 물 / 돈","note":""},
    {"w":"good / bad / new / old","kr":"좋은 / 나쁜 / 새로운 / 오래된","note":"강조는 really, very 하나면 충분하다."},
    {"w":"big / small / long / short","kr":"큰 / 작은 / 긴 / 짧은","note":""},
    {"w":"easy / hard / slow / fast","kr":"쉬운 / 어려운 / 느린 / 빠른","note":"It's hard to say.(말하기 어렵네요)"},
    {"w":"same / different / important / strange","kr":"같은 / 다른 / 중요한 / 이상한","note":"different from ...(~와 다른) 는 비교의 기본."},
    {"w":"quiet / loud / happy / sad","kr":"조용한 / 시끄러운 / 행복한 / 슬픈","note":"감정 형용사는 이 네 개로 시작해 조합한다: a quiet sad feeling."},
    {"w":"true / real / clear / simple","kr":"진짜인 / 실제의 / 분명한 / 단순한","note":""},
    {"w":"sure / ready / free / tired","kr":"확신하는 / 준비된 / 한가한 / 피곤한","note":"I'm not sure. 는 모름을 말하는 가장 자연스러운 방법."},
    {"w":"because / but / so / if","kr":"왜냐하면 / 그러나 / 그래서 / 만약","note":"이 네 개가 문장을 길게 만든다. 짧은 문장 + because 가 유창함의 시작."},
    {"w":"when / before / after / while","kr":"~할 때 / 전에 / 후에 / ~하는 동안","note":""},
    {"w":"about / with / without / for","kr":"~에 대해 / ~와 함께 / ~없이 / ~를 위해","note":"My book is about ... 는 작품 소개의 첫 문장."},
    {"w":"more / most / than / also","kr":"더 / 가장 / ~보다 / 또한","note":""},
    {"w":"maybe / almost / only / even","kr":"아마 / 거의 / 오직 / 심지어","note":"maybe 는 확신 없는 말을 부드럽게 만든다."},
    {"w":"always / often / sometimes / never","kr":"항상 / 자주 / 가끔 / 결코","note":""},
    {"w":"a kind of ...","kr":"일종의 ~","note":"돌려 말하기 도구 ①. It's a kind of story about ..."},
    {"w":"something like ...","kr":"~같은 것","note":"돌려 말하기 도구 ②. It's something like a diary."},
    {"w":"the opposite of ...","kr":"~의 반대","note":"돌려 말하기 도구 ③. 모르는 단어를 아는 단어의 반대로 설명."},
    {"w":"the person who ... / the thing that ...","kr":"~하는 사람 / ~하는 것","note":"돌려 말하기 도구 ④. 명사를 통째로 만들어낸다."},
    {"w":"the feeling when ...","kr":"~할 때의 느낌","note":"돌려 말하기 도구 ⑤. 모든 감정 단어를 대신한다."},
    {"w":"used for / used to ...","kr":"~에 쓰이는","note":"돌려 말하기 도구 ⑥. 사물 설명."},
    {"w":"in other words / I mean","kr":"다시 말해 / 제 말은","note":"돌려 말하기 도구 ⑦. 첫 시도가 실패해도 두 번째 기회를 만든다."},

    {"id":"p07","kr":"미안해요, 못 알아들었어요.","en":"Sorry, I didn't catch that.","keys":[["sorry"],["didn't catch","did not catch","didn't hear","didn't understand","did not understand"]],"tip":"catch 는 '알아듣다'. 못 들었을 때 가장 짧은 정답."},

<script>
/* ================= 상태 · 저장 ================= */
const LS = 'plainwords/v2';
const DEF = {
  packs: [], progress: {}, dial: {}, topics: {},
  stats: { spoken: 0, typed: 0, thinkMs: [], days: [], hintUsed: 0, attempts: 0 },
  settings: { theme: 'light', rate: 0.92, voice: '', inputMode: 'mic', showKr: false },
  unlockedOverride: {}
};
let S = load();

function load() {
  try {
    const raw = localStorage.getItem(LS);
    if (!raw) return fresh();
    const o = JSON.parse(raw);
    const d = fresh();
    return Object.assign(d, o, { settings: Object.assign(d.settings, o.settings || {}), stats: Object.assign(d.stats, o.stats || {}) });
  } catch (e) { return fresh(); }
}
function fresh() { const d = JSON.parse(JSON.stringify(DEF)); d.packs = JSON.parse(JSON.stringify(BUILTIN_PACKS)); return d; }
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast('저장 공간에 쓸 수 없습니다. 파일을 로컬 서버로 열어보세요.'); } }
function today() { return new Date().toISOString().slice(0, 10); }
function markDay() { const t = today(); if (!S.stats.days.includes(t)) { S.stats.days.push(t); save(); } }
function streakDays() {
  const d = [...new Set(S.stats.days)].sort().reverse(); if (!d.length) return 0;
  let n = 0, cur = new Date();
  for (; ;) {
    const k = cur.toISOString().slice(0, 10);
    if (d.includes(k)) { n++; cur.setDate(cur.getDate() - 1); }
    else if (n === 0 && k === today()) { cur.setDate(cur.getDate() - 1); }
    else break;
    if (n > 400) break;
  }
  return n;
}

/* 현재 팩 = 가장 높은 stage */
function packs() { return S.packs.slice().sort((a, b) => a.stage - b.stage); }
function cur() { return packs()[packs().length - 1]; }
function allCore() { const w = []; packs().forEach(p => (p.core || []).forEach(c => w.push(c.w))); return w; }
function allowedSet() {
  const s = new Set(['korea', 'korean', 'seoul', 'london', 'english', 'clara', 'bennett', 'yeonsu', 'paris', 'tokyo', 'america', 'american', 'french', 'japan', 'ok', 'okay', 'yeah', 'um', 'uh', 'hmm']);
  packs().forEach(p => (p.allowed || []).forEach(w => s.add(w)));
  packs().forEach(p => (p.core || []).forEach(c => String(c.w).toLowerCase().split(/[^a-z']+/).forEach(t => t && s.add(t))));
  return s;
}

/* ================= 텍스트 유틸 · 채점 ================= */
const CONTR = [[/\bi'm\b/g, 'i am'], [/\bit's\b/g, 'it is'], [/\bthat's\b/g, 'that is'], [/\bwhat's\b/g, 'what is'], [/\bthere's\b/g, 'there is'],
[/\bdon't\b/g, 'do not'], [/\bdoesn't\b/g, 'does not'], [/\bdidn't\b/g, 'did not'], [/\bcan't\b/g, 'cannot'], [/\bwon't\b/g, 'will not'],
[/\bisn't\b/g, 'is not'], [/\baren't\b/g, 'are not'], [/\bwasn't\b/g, 'was not'], [/\bcouldn't\b/g, 'could not'], [/\bwouldn't\b/g, 'would not'],
[/\bi'll\b/g, 'i will'], [/\bi've\b/g, 'i have'], [/\bi'd\b/g, 'i would'], [/\byou're\b/g, 'you are'], [/\bwe're\b/g, 'we are'],
[/\bthey're\b/g, 'they are'], [/\bhe's\b/g, 'he is'], [/\bshe's\b/g, 'she is'], [/\blet's\b/g, 'let us']];

function base(s) { return ' ' + String(s || '').toLowerCase().replace(/[‘’ʼ]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim() + ' '; }
function expand(s) { let t = base(s); CONTR.forEach(([re, to]) => { t = t.replace(re, to); }); return ' ' + t.trim().replace(/\s+/g, ' ') + ' '; }
function strip(s) { return base(s).replace(/'/g, ''); }
function words(s) { return base(s).trim().split(' ').filter(Boolean); }

function varRe(v) {
  const parts = String(v).toLowerCase().replace(/[‘’]/g, "'").split(/\s+/).filter(Boolean);
  const body = parts.map(p => {
    const e = p.replace(/[^a-z0-9']/g, '').replace(/'/g, "'?");
    return e.length <= 2 ? e : e + "[a-z']*";
  }).join('\\s+');
  return new RegExp('(^|\\s)' + body + '(\\s|$)');
}
function hitVariant(v, forms) { const re = varRe(v); return forms.some(f => re.test(f)); }

/* keys: [[변형...],[변형...]]  → {score, hits, total, missing[]} */
function grade(answer, keys, banned) {
  const forms = [base(answer), expand(answer), strip(answer), expand(answer).replace(/'/g, '')];
  const total = (keys || []).length;
  let hits = 0; const missing = [];
  (keys || []).forEach(g => {
    const arr = Array.isArray(g) ? g : [g];
    if (arr.some(v => hitVariant(v, forms))) hits++; else missing.push(arr[0]);
  });
  const bad = (banned || []).filter(b => hitVariant(b, forms));
  let score = total ? Math.round(100 * hits / total) : (words(answer).length >= 4 ? 80 : 0);
  if (bad.length) score = Math.max(0, score - 45);
  return { score, hits, total, missing, banned: bad, pass: total ? (hits === total && !bad.length) : (score >= 70 && !bad.length) };
}

/* 쉬운말 카드: cover 그룹 중 70% 이상이면 통과 + 금지어 없음 + 최소 길이 */
function gradePara(answer, item) {
  const forms = [base(answer), expand(answer), strip(answer)];
  const groups = item.cover || [];
  let hits = 0; const missing = [];
  groups.forEach(g => { if (g.some(v => hitVariant(v, forms))) hits++; else missing.push(g[0]); });
  const bad = (item.banned || []).filter(b => hitVariant(b, forms));
  const n = words(answer).length;
  let score = groups.length ? Math.round(100 * hits / groups.length) : 0;
  if (bad.length) score = Math.min(score, 30);
  if (n < 5) score = Math.min(score, 40);
  return { score, hits, total: groups.length, missing, banned: bad, len: n, pass: !bad.length && n >= 5 && groups.length > 0 && hits / groups.length >= 0.7 };
}

function stems(t) {
  return [t, t.replace(/s$/, ''), t.replace(/es$/, ''), t.replace(/ed$/, ''), t.replace(/d$/, ''), t.replace(/ing$/, ''),
  t.replace(/ing$/, 'e'), t.replace(/ly$/, ''), t.replace(/ies$/, 'y'), t.replace(/er$/, ''), t.replace(/er$/, 'e'),
  t.replace(/est$/, ''), t.replace(/est$/, 'e'), t.replace(/([a-z])\1(ed|ing|er|est)$/, '$1'), t + 'e'];
}
function offCore(answer) {
  const set = allowedSet(); const out = [];
  words(expand(answer)).forEach(w => {
    const t = w.replace(/'/g, '');
    if (!t || /^[0-9]+$/.test(t)) return;
    if (!stems(t).some(c => set.has(c))) out.push(w);
  });
  return [...new Set(out)];
}

/* ================= 진도 ================= */
function P(id) { if (!S.progress[id]) S.progress[id] = { streak: 0, pass: 0, fail: 0, hint: 0, spoken: 0, last: 0 }; return S.progress[id]; }
function mastered(id) { return P(id).streak >= 3; }
/* 브라우저가 음성 인식을 아예 지원하지 않으면 타이핑도 숙달로 인정한다(막다른 길 방지) */
function credit(spoken) { return spoken || !speechOK(); }
function record(id, ok, hintUsed, spoken) {
  const p = P(id); p.last = Date.now();
  S.stats.attempts++; if (spoken) S.stats.spoken++; else S.stats.typed++;
  if (hintUsed) { p.hint++; S.stats.hintUsed++; }
  if (ok && !hintUsed && credit(spoken)) { p.pass++; p.streak++; p.spoken++; }
  else if (ok) { p.pass++; p.streak = Math.max(p.streak, 0); }
  else { p.fail++; p.streak = 0; }
  markDay(); save();
}

function rate(list) { if (!list.length) return 0; return list.filter(x => mastered(x.id)).length / list.length; }
function gateState() {
  const c = cur(), g = c.gate || {};
  const pm = rate(c.patterns || []), xm = rate(c.paraphrase || []);
  const dial = (c.dialogues || []).filter(d => (S.dial[d.id] || {}).best >= (g.dialogueMinScore || 80)).length;
  const tops = (c.topics || []).filter(t => { const r = S.topics[t.id]; return r && r.sec >= (g.topicMinSeconds || 45) && r.words >= (g.topicMinWords || 55); }).length;
  const hintRate = S.stats.attempts ? S.stats.hintUsed / S.stats.attempts : 0;
  const spokenRate = !speechOK() ? 1 : ((S.stats.spoken + S.stats.typed) ? S.stats.spoken / (S.stats.spoken + S.stats.typed) : 0);
  const items = [
    { k: '패턴 문장 숙달', now: pm, need: g.patternMastery ?? .9, fmt: 'pct', detail: (c.patterns || []).filter(x => mastered(x.id)).length + ' / ' + (c.patterns || []).length + ' 문장 (무힌트·음성 3연속)' },

function highlight(txt) {
  const set = allowedSet();
  return words(txt).map(w => {
    const t = w.replace(/'/g, '');
    const ok = /^[0-9]+$/.test(t) || stems(t).some(x => set.has(x)) || CONTR.some(([re]) => re.test(' ' + w + ' '));
    return ok ? esc(w) : '<span class="off-core">' + esc(w) + '</span>';
  }).join(' ');
}
function tkStart(id) {
  const t = (cur().topics || []).find(x => x.id === id);
  T = { topic: t, base: '', live: '', sec: 0, running: false, done: false, timer: null };
  render();
}
function tkMic() {
  if (T.running) { tkStop(); return; }
  T.running = true; T.sec = 0; T.base = ''; T.live = '';
  T.timer = setInterval(() => {
    T.sec++;
    const n = document.getElementById('tkSec'); if (n) n.textContent = T.sec;
    if (T.sec >= (T.topic.seconds || 60) + 45) tkStop();
  }, 1000);
  T.needTap = false;
  T.loop = () => {
    T.needTap = false;
    const ok = startRec({
      continuous: true,
      onPartial: t => { T.live = t; const h = view.querySelector('.heard'); if (h) { h.textContent = joinTranscript(T.base, t); h.classList.remove('empty'); } },
      onEnd: t => {
        T.base = joinTranscript(T.base, t); T.live = '';
        if (T.running) setTimeout(() => { if (T.running) T.loop(); }, IOS ? 250 : 120);
      },
      onError: e => {
        if (e === 'no-speech') return;                       /* 잠깐 조용했을 뿐 — 계속 간다 */
        if (e === 'not-allowed' || e === 'service-not-allowed') { toast('마이크가 막혀 있습니다'); T.running = false; clearInterval(T.timer); render(); return; }
        T.needTap = true; render();                          /* 사파리가 스스로 재시작을 막은 경우 */
      }
    });
    if (!ok) { T.needTap = true; render(); }
  };
  if (S.settings.inputMode !== 'mic') { toast('설정이 타이핑 모드입니다. 1분 말하기는 음성으로만 측정됩니다.'); }
  T.loop(); render();
}
function tkStop() {
  T.running = false; clearInterval(T.timer); stopRec();
  setTimeout(() => {
    const txt = joinTranscript(T.base, T.live), w = words(txt).length;
    T.done = true;
    const wpm = T.sec ? Math.round(w / T.sec * 60) : 0;
    const prev = S.topics[T.topic.id];
    const rec2 = { sec: T.sec, words: w, wpm, at: Date.now() };
    if (!prev || (w >= prev.words)) S.topics[T.topic.id] = rec2; else S.topics[T.topic.id] = prev;
    S.stats.spoken++; S.stats.attempts++; markDay(); save(); render(); renderTabs();
  }, 500);
}

function doImport() {
  const box = $('#importBox'), msg = $('#importMsg');
  let t = box.value.trim();
  t = t.replace(/^```(json)?/i, '').replace(/```$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < 0) { msg.innerHTML = '<span class="miss">JSON을 찾을 수 없습니다.</span>'; return; }
  let o;
  try { o = JSON.parse(t.slice(a, b + 1)); } catch (e) { msg.innerHTML = '<span class="miss">JSON 형식 오류: ' + esc(e.message) + '</span>'; return; }
  const errs = [];
  if (o.schema !== 'plainwords/v1') errs.push('schema 가 "plainwords/v1" 이 아닙니다');
  if (typeof o.stage !== 'number') errs.push('stage 가 숫자가 아닙니다');
  ['core', 'allowed', 'patterns', 'paraphrase', 'dialogues', 'topics'].forEach(k => { if (!Array.isArray(o[k])) errs.push(k + ' 배열이 없습니다'); });
  if (!errs.length) {
    (o.patterns || []).forEach((p, i) => { if (!p.id || !p.kr || !p.en || !Array.isArray(p.keys)) errs.push('patterns[' + i + '] 형식 오류'); });
    (o.paraphrase || []).forEach((p, i) => { if (!p.id || !p.term || !p.model || !Array.isArray(p.cover)) errs.push('paraphrase[' + i + '] 형식 오류'); });
    (o.dialogues || []).forEach((d, i) => { if (!d.id || !Array.isArray(d.turns)) errs.push('dialogues[' + i + '] 형식 오류'); });
  }
  if (errs.length) { msg.innerHTML = '<span class="miss">' + esc(errs.slice(0, 4).join(' / ')) + '</span>'; return; }
  const ids = new Set(); let dup = 0;
  packs().forEach(p => [...(p.patterns || []), ...(p.paraphrase || []), ...(p.topics || []), ...(p.dialogues || [])].forEach(x => ids.add(x.id)));
  [...(o.patterns || []), ...(o.paraphrase || []), ...(o.topics || []), ...(o.dialogues || [])].forEach(x => { if (ids.has(x.id)) dup++; });
  if (dup) { msg.innerHTML = '<span class="miss">id가 ' + dup + '개 겹칩니다. 클로드에게 id를 s' + o.stage + ' 로 시작하게 다시 만들어 달라고 하세요.</span>'; return; }
  const i = S.packs.findIndex(p => p.stage === o.stage);
  if (i >= 0) { if (!confirm(o.stage + '단계가 이미 있습니다. 덮어쓸까요?')) return; S.packs[i] = o; }
  else S.packs.push(o);
  save();
  msg.innerHTML = '<span class="hit">✓ ' + o.stage + '단계를 추가했습니다.</span>';
  toast(o.stage + '단계가 열렸습니다');
  setTimeout(() => { go('home'); }, 700);
}

      <select id="voiceSel" style="font:inherit;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
        <option value="">(자동)</option>
        ${voices.map(v => `<option value="${esc(v.name)}" ${S.settings.voice === v.name ? 'selected' : ''}>${esc(v.name)} — ${esc(v.lang)}</option>`).join('')}
      </select>
      <button class="btn sm" data-act="say" data-v="This is how I sound. I will read the model answers for you.">들어보기</button>
    </div>
    <div class="row" style="margin-top:12px"><span class="small muted">속도</span>
      <input type="range" id="rateSel" min="0.6" max="1.2" step="0.02" value="${S.settings.rate}" style="flex:1">
      <span class="small muted" id="rateVal">${S.settings.rate}</span></div>
  </div>
  <div class="card">
    <b>백업 / 복원</b>
    <p class="small muted" style="margin:6px 0 10px">진도는 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 사라지니 가끔 내려받아 두세요.</p>
    <div class="row">
      <button class="btn" data-act="export">진도 내려받기</button>
      <button class="btn" data-act="importfile">파일에서 복원</button>
      <span class="grow"></span>
      <button class="btn ghost sm" data-act="reset">진도 초기화</button>
    </div>
    <input type="file" id="fileIn" accept="application/json" style="display:none">
  </div>
  <div class="card">
    <b>화면</b>
    <div class="row" style="margin-top:10px">
      <button class="btn" data-act="theme">${S.settings.theme === 'dark' ? '밝게' : '어둡게'}</button>
    </div>
  </div>
  ${IOS ? iosCard() : ''}
  <div class="card small muted">
    <b>이 기기</b><br>
    음성 인식 ${speechOK() ? '가능' : '불가'} · 읽어주기 ${window.speechSynthesis ? '가능' : '불가'} ·
    ${IOS ? 'iOS' : '데스크톱/기타'}${STANDALONE ? ' · 홈 화면 앱' : ''} ·
    저장 ${(() => { try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); return '가능'; } catch (e) { return '불가(비공개 모드?)'; } })()}
  </div>`;
}

/* ================= 이벤트 ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
  if (t.dataset.tab) { go(t.dataset.tab); return; }
  const v = t.dataset.v; const a = t.dataset.act;
  if (a === 'go') { go(v); return; }
  if (a === 'say') { e.preventDefault(); say(v); return; }
  if (a === 'shadow') { say(v, () => toast('이제 똑같이 따라 말해보세요')); return; }
  if (a === 'theme') { S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.settings.theme; save(); if (TAB === 'set') render(); return; }
  /* 드릴 */
  if (a === 'mic') { micToggle(); return; }
  if (a === 'check') { doCheck(); return; }
  if (a === 'next') { doNext(); return; }
  if (a === 'retry') { D.phase = 'ask'; D.heard = ''; D.res = null; paintDrill(); return; }
  if (a === 'hint') { D.hint++; paintDrill(); return; }
  if (a === 'reveal') {
    D.hint = 3; const it = D.list[D.i];
    D.heard = ''; D.res = { score: 0, pass: false, missing: [], banned: [], hits: 0, total: 0 }; D.phase = 'res';
    const pr = P(it.id); pr.streak = 0; pr.hint++; S.stats.hintUsed++; S.stats.attempts++; markDay(); save();
    paintDrill(); return;
  }
  if (a === 'skip') { doNext(); return; }
  /* 대화 */
  if (a === 'dlgo') { const d = (cur().dialogues || []).find(x => x.id === v); DL = { d, i: 0, heard: '', res: null, hint: 0, scores: [], said: {}, spoken: false }; if (d.turns[0].role === 'partner') say(d.turns[0].en); render(); return; }
  if (a === 'dlend') { DL = null; stopRec(); render(); return; }
  if (a === 'dlnext') { dlNext(); return; }
  if (a === 'dlcheck') { dlCheck(); return; }
  if (a === 'dlretry') { DL.res = null; DL.heard = ''; render(); return; }
  if (a === 'dlhint') { DL.hint = 1; render(); return; }
  if (a === 'dlkr') { S.settings.showKr = !S.settings.showKr; save(); render(); return; }
  if (a === 'dlmic') {
    if (recOn) { stopRec(); return; }
    DL.spoken = true;
    startRec({
      onPartial: t2 => { DL.heard = t2; const h = $('#heard'); if (h) { h.textContent = t2; h.classList.remove('empty'); } },
      onEnd: t2 => { if (t2) DL.heard = t2; render(); if (DL.heard.trim()) dlCheck(); },
      onError: er => { toast('마이크: ' + er); render(); }
    });
    render(); return;
  }
  /* 1분 말하기 */
  if (a === 'tkgo') { tkStart(v); return; }
  if (a === 'tkmic') { tkMic(); return; }
  if (a === 'tkresume') { if (T && T.running && T.loop) T.loop(); return; }
  if (a === 'tkend') { if (T) { T.running = false; clearInterval(T.timer); } stopRec(); T = null; render(); return; }
  /* 다음 단계 */
  if (a === 'copyprompt') { copy(buildPrompt()); return; }
  if (a === 'showprompt') { const b = $('#promptBox'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; return; }
  if (a === 'override') { e.preventDefault(); if (confirm('기준을 넘지 않았습니다. 그래도 다음 단계 프롬프트를 열까요?')) { S.unlockedOverride[cur().stage] = true; save(); render(); } return; }
  if (a === 'import') { doImport(); return; }
  if (a === 'delpack') { if (confirm(v + '단계 데이터를 삭제할까요? 진도 기록은 남습니다.')) { S.packs = S.packs.filter(p => String(p.stage) !== String(v)); save(); render(); renderTabs(); } return; }
  /* 설정 */
  if (a === 'mode') { S.settings.inputMode = v; save(); render(); return; }
  if (a === 'export') {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const u = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = u; link.download = 'plainwords-backup-' + today() + '.json'; link.click();
    setTimeout(() => URL.revokeObjectURL(u), 1000); return;
  }
  if (a === 'importfile') { $('#fileIn').click(); return; }
  if (a === 'reset') { if (confirm('모든 진도를 지웁니다. 단계 데이터도 1단계만 남습니다. 계속할까요?')) { localStorage.removeItem(LS); S = fresh(); save(); go('home'); } return; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'voiceSel') { S.settings.voice = e.target.value; save(); say('Good. This is the voice you will hear.'); }
  if (e.target.id === 'fileIn') {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); S = Object.assign(fresh(), o); save(); toast('복원했습니다'); go('home'); } catch (err) { toast('파일을 읽을 수 없습니다'); } };
    r.readAsText(f);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'rateSel') { S.settings.rate = parseFloat(e.target.value); $('#rateVal').textContent = S.settings.rate.toFixed(2); save(); }
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input' || tag === 'select') {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { if (TAB === 'dialog' && DL) dlCheck(); else if (D) doCheck(); }
    return;
  }
  if (e.code === 'Space') {
    e.preventDefault();
    if (TAB === 'talk' && T) tkMic();
    else if (TAB === 'dialog' && DL && DL.d.turns[DL.i] && DL.d.turns[DL.i].role === 'you' && !DL.res) { document.querySelector('[data-act=dlmic]') && document.querySelector('[data-act=dlmic]').click(); }
    else if (D && D.phase === 'ask') micToggle();
    return;
  }
  if (e.key === 'Enter') {
    if (TAB === 'dialog' && DL) { DL.res ? dlNext() : (DL.d.turns[DL.i] && DL.d.turns[DL.i].role === 'partner' ? dlNext() : dlCheck()); }
    else if (D) { D.phase === 'ask' ? doCheck() : doNext(); }
    return;
  }
  if (e.key === 'h' || e.key === 'H') { if (D && D.phase === 'ask') { D.hint++; paintDrill(); } }
});

/* ================= 시작 ================= */
document.addEventListener('pointerdown', unlockTTS, { once: true });
document.addEventListener('touchstart', unlockTTS, { once: true, passive: true });
document.addEventListener('toggle', e => {
  if (e.target.id === 'iosHelp' && !e.target.open) { S.settings.iosSeen = true; save(); }
}, true);
document.documentElement.dataset.theme = S.settings.theme || 'light';
$('#themeBtn').addEventListener('click', () => { S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.settings.theme; save(); if (TAB === 'set') render(); });
if (!speechOK() && S.settings.inputMode === 'mic') { S.settings.inputMode = 'type'; }
renderTabs(); render();
</script>
</body></html>
