<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="포켓">
<meta name="theme-color" content="#faf8f5">
<title>Plain Words 포켓</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1c1a17;--dim:#6f6a62;--line:#e6e1d8;--accent:#1f6f5c;--soft:#e6f0ec;--warn:#b4531f;--warnsoft:#fbeee5;}
html[data-t="dark"]{--bg:#14150f;--card:#1c1e18;--ink:#eae7df;--dim:#9a958a;--line:#2e312a;--accent:#7fc9b0;--soft:#1b2b25;--warn:#e0a06a;--warnsoft:#2e2519}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
 overscroll-behavior:none;-webkit-font-smoothing:antialiased}
.serif{font-family:"Iowan Old Style",Georgia,"Nanum Myeongjo","Noto Serif KR",serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hin{display:flex;align-items:center;gap:10px;padding:11px 16px}
.hin b{font-size:15px;font-weight:600}
.hin small{color:var(--dim);font-size:12px}
.grow{flex:1}
.ico{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:14px;color:var(--dim)}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);
 display:grid;grid-template-columns:1fr 1fr 1fr;padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:12px 0 13px;font-size:13px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:18px;line-height:1}
nav button.on{color:var(--ink);font-weight:600}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin:16px 0;
 box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.05)}
.face{min-height:40vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:8px 4px}
.tag{display:inline-block;font-size:11.5px;letter-spacing:.04em;color:var(--accent);background:var(--soft);border-radius:99px;padding:3px 10px;align-self:center;margin-bottom:16px}
.tag.d{color:var(--warn);background:var(--warnsoft)}
.q{font-size:25px;line-height:1.45;letter-spacing:-.02em}
.sub{font-size:13.5px;color:var(--dim);margin-top:10px}
.a{font-size:24px;line-height:1.5;letter-spacing:-.01em}
.tip{font-size:13.5px;color:var(--dim);margin-top:16px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
.tapnote{text-align:center;color:var(--dim);font-size:13px;margin-top:-6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.acts button{border:1px solid var(--line);border-radius:12px;padding:15px 0;font-size:16px;background:var(--card)}
.acts button.ok{background:var(--accent);color:#fff;border-color:var(--accent)}
html[data-t="dark"] .acts button.ok{color:#0f1410}
.big{width:100%;border:1px solid var(--line);border-radius:12px;padding:15px 0;font-size:16px;background:var(--card);margin-top:10px}
.big.fill{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mini{font-size:13px;color:var(--dim)}
.center{text-align:center}
h1{font-size:22px;margin:22px 0 6px;letter-spacing:-.02em}
.lead{color:var(--dim);font-size:14.5px;margin:0 0 16px}
input[type=search]{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);-webkit-appearance:none}
.sec{margin:24px 0 8px;font-size:13px;color:var(--dim);letter-spacing:.03em}
.row{border-bottom:1px solid var(--line);padding:13px 2px}
.row .k{font-size:15.5px;line-height:1.5}
.row .e{font-size:16.5px;line-height:1.5;margin-top:4px;font-family:Georgia,"Iowan Old Style",serif;color:var(--accent)}
.row .e.hide{filter:blur(5.5px);opacity:.6}
.row .n{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.6}
.chips{line-height:2.2}
.chips span{border:1px solid var(--line);border-radius:7px;padding:3px 8px;margin:0 5px 5px 0;font-size:13.5px;display:inline-block}
article{font-size:17px;line-height:1.85}
article h2{font-size:19px;margin:34px 0 10px;letter-spacing:-.01em}
article p{margin:0 0 14px}
article .dek{color:var(--dim);font-size:14px;margin-top:-6px}
article ol.tools{list-style:none;padding:0;counter-reset:t}
article ol.tools li{counter-increment:t;border-top:1px solid var(--line);padding:14px 0}
article ol.tools li:before{content:counter(t);color:var(--accent);font-size:12px;display:block;margin-bottom:4px}
article ol.tools .en{font-size:19px;font-family:Georgia,serif}
article ol.tools .kr{color:var(--dim);font-size:14px;margin-bottom:6px}
article ol.tools p{font-size:14.5px;color:var(--dim);margin:0}
article dl{margin:0}
article dt{font-family:Georgia,serif;font-size:17px;margin-top:16px}
article dt span{font-family:inherit;font-size:13px;color:var(--dim);margin-left:6px}
article dd{margin:3px 0 0;font-size:14.5px;color:var(--dim)}
article ul.tips{list-style:none;padding:0}
article ul.tips li{border-top:1px solid var(--line);padding:13px 0}
article ul.tips .en{font-family:Georgia,serif;font-size:17px}
article ul.tips p{font-size:14px;color:var(--dim);margin:4px 0 0}
article table.cmp{width:100%;border-collapse:collapse}
article table.cmp td{border-bottom:1px solid var(--line);padding:11px 0;vertical-align:top;font-size:15px}
article table.cmp .l{width:38%;padding-right:12px}
article table.cmp .l span{display:block;font-size:12px;color:var(--dim)}
article table.cmp .r{color:var(--dim);font-family:Georgia,serif}
article ol.rules li{margin:0 0 12px}
article .end{font-size:13px;color:var(--dim);margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
 padding:9px 16px;border-radius:99px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
@media print{nav,header,.acts,.big{display:none}body{font-size:11pt}main{padding:0}}
</style>
</head>
<body>
<header>
  <div class="hin"><b class="serif">Plain Words 포켓</b><small id="stg"></small><span class="grow"></span>
  <button class="ico" id="th">◐</button></div>
  <div class="prog"><i id="pg" style="width:0%"></i></div>
</header>
<main id="v"></main>
<nav>
  <button data-go="card" class="on"><i>◆</i>카드</button>
  <button data-go="list"><i>≡</i>목록</button>
  <button data-go="read"><i>¶</i>해설</button>
</nav>
<div class="toast" id="ts"></div>
<script>
var D = {"stage":1,"title":"막히지 않고 이어가기 — 300단어의 뼈대","goal":"어려운 단어가 떠오르지 않아도 문장이 끊기지 않게 만든다. 쉬운 단어로 돌려 말하는 회로를 몸에 붙이는 단계.","deck":[{"id":"tool0","tag":"도구","front":"일종의 ~","sub":"이걸 영어로 어떻게 시작하죠?","back":"a kind of ...","tip":"돌려 말하기 도구 ①. It's a kind of story about ...","w":3},{"id":"tool1","tag":"도구","front":"~같은 것","sub":"이걸 영어로 어떻게 시작하죠?","back":"something like ...","tip":"돌려 말하기 도구 ②. It's something like a diary.","w":3},{"id":"tool2","tag":"도구","front":"~의 반대","sub":"이걸 영어로 어떻게 시작하죠?","back":"the opposite of ...","tip":"돌려 말하기 도구 ③. 모르는 단어를 아는 단어의 반대로 설명.","w":3},{"id":"tool3","tag":"도구","front":"~하는 사람 / ~하는 것","sub":"이걸 영어로 어떻게 시작하죠?","back":"the person who ... / the thing that ...","tip":"돌려 말하기 도구 ④. 명사를 통째로 만들어낸다.","w":3},{"id":"tool4","tag":"도구","front":"~할 때의 느낌","sub":"이걸 영어로 어떻게 시작하죠?","back":"the feeling when ...","tip":"돌려 말하기 도구 ⑤. 모든 감정 단어를 대신한다.","w":3},{"id":"tool5","tag":"도구","front":"~에 쓰이는","sub":"이걸 영어로 어떻게 시작하죠?","back":"used for / used to ...","tip":"돌려 말하기 도구 ⑥. 사물 설명.","w":3},{"id":"tool6","tag":"도구","front":"다시 말해 / 제 말은","sub":"이걸 영어로 어떻게 시작하죠?","back":"in other words / I mean ...","tip":"돌려 말하기 도구 ⑦. 첫 시도가 실패해도 두 번째 기회를 만든다.","w":3},{"id":"tool7","tag":"도구","front":"~를 뭐라고 하죠?","sub":"이걸 영어로 어떻게 시작하죠?","back":"How do you say ...?","tip":"돌려 말하기 도구 ⑧. 모른다고 멈추는 대신 상대를 끌어들인다.","w":3},{"id":"p01","tag":"패턴","front":"제 말은, 제가 하고 싶은 말은 이거예요.","sub":"","back":"What I want to say is this.","tip":"막혔을 때 시간을 버는 첫 문장. 이 말을 하는 동안 뒷문장을 만든다.","w":2},{"id":"p02","tag":"패턴","front":"지금 새 소설을 쓰고 있어요.","sub":"","back":"I'm working on a new novel.","tip":"work on 은 '작업 중'을 말하는 가장 흔한 표현.","w":2},{"id":"p03","tag":"패턴","front":"제 책은 기억에 관한 이야기예요.","sub":"","back":"My book is about memory.","tip":"작품 소개는 A is about B 하나로 시작하면 된다.","w":2},{"id":"p04","tag":"패턴","front":"한 문장으로 말하면, 집을 잃은 여자에 관한 이야기예요.","sub":"","back":"In one sentence, it's a story about a woman who lost her home.","tip":"the woman who ... 처럼 who 로 인물을 만들어 붙인다.","w":2},{"id":"p05","tag":"패턴","front":"그 단어가 무슨 뜻인지 잘 모르겠어요.","sub":"","back":"I'm not sure what that word means.","tip":"모른다고 말하는 건 실력 부족이 아니라 대화 기술이다.","w":2},{"id":"p06","tag":"패턴","front":"조금만 천천히 다시 말해 주실 수 있어요?","sub":"","back":"Could you say that again, a little more slowly?","tip":"이 한 문장이 리스닝 실력의 절반을 대신한다.","w":2},{"id":"p07","tag":"패턴","front":"미안해요, 못 알아들었어요.","sub":"","back":"Sorry, I didn't catch that.","tip":"catch 는 '알아듣다'. 못 들었을 때 가장 짧은 정답.","w":2},{"id":"p08","tag":"패턴","front":"잠깐만요, 생각 좀 할게요.","sub":"","back":"Wait a moment — let me think.","tip":"침묵보다 훨씬 낫다. 소리 내어 시간을 벌 것.","w":2},{"id":"p09","tag":"패턴","front":"그거 영어로 뭐라고 하죠? 사람을 오래 슬프게 하는 그런 느낌인데요.","sub":"","back":"How do you say it in English? It's the feeling when you stay sad for a long time.","tip":"모르는 단어를 상대에게 물어보며 설명까지 붙이는 이중 기술.","w":2},{"id":"p10","tag":"패턴","front":"쓰는 데 삼 년 걸렸어요.","sub":"","back":"It took me three years to write it.","tip":"It takes + 시간 + to + 동사. 통째로 외운다.","w":2},{"id":"p11","tag":"패턴","front":"그 부분이 저한테는 제일 어려웠어요.","sub":"","back":"That part was the hardest for me.","tip":"part 는 '부분'을 가리키는 만능 명사.","w":2},{"id":"p12","tag":"패턴","front":"저는 보통 아침에 써요, 조용하니까요.","sub":"","back":"I usually write in the morning, because it's quiet.","tip":"because 를 붙이는 습관이 문장 길이를 두 배로 만든다.","w":2},{"id":"p13","tag":"패턴","front":"글이 안 써지는 날도 있어요. 그럴 땐 그냥 걸어요.","sub":"","back":"Some days nothing comes. On those days I just walk.","tip":"nothing comes 는 어려운 개념을 두 단어로 끝낸 좋은 예.","w":2},{"id":"p14","tag":"패턴","front":"번역본이 내년에 나와요.","sub":"","back":"The translation is coming out next year.","tip":"come out = 출간되다. publish 를 몰라도 된다.","w":2},{"id":"p15","tag":"패턴","front":"당신 책 읽었어요. 정말 좋았어요.","sub":"","back":"I read your book. I really liked it.","tip":"짧게 두 문장. 길게 말하려다 놓치지 말 것.","w":2},{"id":"p16","tag":"패턴","front":"특히 마지막 장이 오래 남았어요.","sub":"","back":"The last chapter stayed with me for a long time.","tip":"stay with me 는 '여운이 남다'를 쉬운 말로 옮긴 것.","w":2},{"id":"p17","tag":"패턴","front":"저는 그렇게 생각하지 않아요. 제 생각엔 좀 다른 것 같아요.","sub":"","back":"I don't think so. I think it's a little different.","tip":"반대 의견은 I don't think so + because 로 부드럽게.","w":2},{"id":"p18","tag":"패턴","front":"예를 하나 들어도 될까요?","sub":"","back":"Can I give you an example?","tip":"설명이 막히면 예시로 도망친다. 항상 통한다.","w":2},{"id":"p19","tag":"패턴","front":"제 인물들은 대부분 말이 없는 사람들이에요.","sub":"","back":"Most of my characters are quiet people.","tip":"character 를 몰라도 the people in my book 으로 대체 가능.","w":2},{"id":"p20","tag":"패턴","front":"이 이야기는 실제로 있었던 일에서 시작됐어요.","sub":"","back":"This story started from something that really happened.","tip":"something that ... 구조를 여기서 몸에 붙인다.","w":2},{"id":"p21","tag":"패턴","front":"제 영어가 좋지 않아요. 천천히 갈게요.","sub":"","back":"My English is not good, so I'll go slowly.","tip":"먼저 말해두면 상대가 속도를 맞춰준다. 부끄러운 일이 아니다.","w":2},{"id":"p22","tag":"패턴","front":"그렇게 말해줘서 고마워요.","sub":"","back":"Thank you for saying that.","tip":"Thank you for + -ing 는 감사의 만능 틀.","w":2},{"id":"p23","tag":"패턴","front":"다음 주에 이 얘기 다시 해도 될까요?","sub":"","back":"Can we talk about this again next week?","tip":"","w":2},{"id":"p24","tag":"패턴","front":"메일 주소 알려주실 수 있어요?","sub":"","back":"Could you give me your email?","tip":"","w":2},{"id":"p25","tag":"패턴","front":"저는 고기를 안 먹어요. 채소만 먹어요.","sub":"","back":"I don't eat meat. I only eat vegetables.","tip":"vegetarian 을 몰라도 이렇게 하면 끝난다.","w":2},{"id":"p26","tag":"패턴","front":"물 한 잔만 주시겠어요?","sub":"","back":"Could I have a glass of water, please?","tip":"","w":2},{"id":"p27","tag":"패턴","front":"한 시간쯤 늦을 것 같아요.","sub":"","back":"I think I'll be about an hour late.","tip":"about 을 붙이면 정확하지 않아도 안전하다.","w":2},{"id":"p28","tag":"패턴","front":"비행이 길어서 아직 몸이 밤인 것 같아요.","sub":"","back":"It was a long flight, so my body still thinks it's night.","tip":"jet lag 를 몰라도 이 문장이면 다 통한다.","w":2},{"id":"p29","tag":"패턴","front":"제가 제대로 이해했는지 볼게요. 그러니까 이 부분을 줄이자는 말씀이죠?","sub":"","back":"Let me see if I understand. So you want me to make this part shorter?","tip":"확인 문장은 오해를 막고, 동시에 생각할 시간을 준다.","w":2},{"id":"p30","tag":"패턴","front":"그건 제가 생각한 것과 좀 달라요. 조금 더 생각해볼게요.","sub":"","back":"That's a little different from what I thought. Let me think about it more.","tip":"바로 거절하지 않고 시간을 버는 프로의 문장.","w":2},{"id":"x01","tag":"쉬운 말","front":"melancholy","sub":"멜랑콜리, 우수  ·  이 말 없이: melancholy, melancholic","back":"a quiet sad feeling that stays with you for a long time","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x02","tag":"쉬운 말","front":"narrative structure","sub":"서사 구조  ·  이 말 없이: narrative, structure","back":"the way a story is put together","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x03","tag":"쉬운 말","front":"protagonist","sub":"주인공  ·  이 말 없이: protagonist, hero, heroine","back":"the main person in the story","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x04","tag":"쉬운 말","front":"metaphor","sub":"은유  ·  이 말 없이: metaphor, simile","back":"when you say one thing but you mean another thing","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x05","tag":"쉬운 말","front":"first draft","sub":"초고  ·  이 말 없이: draft","back":"the first writing, before I make it better","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x06","tag":"쉬운 말","front":"deadline","sub":"마감  ·  이 말 없이: deadline","back":"the last day I can give them my work","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x07","tag":"쉬운 말","front":"royalties","sub":"인세  ·  이 말 없이: royalty, royalties","back":"the money a writer gets from every book they sell","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x08","tag":"쉬운 말","front":"literary agent","sub":"에이전트  ·  이 말 없이: agent, agency","back":"the person who sells my book to publishers for me","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x09","tag":"쉬운 말","front":"publisher","sub":"출판사  ·  이 말 없이: publisher, publish, publishing","back":"a company that makes and sells books","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x10","tag":"쉬운 말","front":"ambiguous ending","sub":"열린 결말  ·  이 말 없이: ambiguous, ambiguity","back":"an ending that doesn't tell you what really happened","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x11","tag":"쉬운 말","front":"autobiographical","sub":"자전적인  ·  이 말 없이: autobiographical, autobiography, memoir","back":"the story comes from my own life","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x12","tag":"쉬운 말","front":"nostalgia","sub":"노스탤지어, 향수  ·  이 말 없이: nostalgia, nostalgic","back":"the warm sad feeling when you miss a time that is gone","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x13","tag":"쉬운 말","front":"irony","sub":"아이러니  ·  이 말 없이: irony, ironic","back":"when what happens is the opposite of what you expect","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x14","tag":"쉬운 말","front":"translation rights","sub":"번역 판권  ·  이 말 없이: rights, right, copyright","back":"when a country can make my book in their own language","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x15","tag":"쉬운 말","front":"writer's block","sub":"슬럼프, 글이 안 써지는 때  ·  이 말 없이: block, blocked","back":"the days when I sit down and nothing comes","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x16","tag":"쉬운 말","front":"the setting of a novel","sub":"작품의 배경  ·  이 말 없이: setting","back":"the place and the time where the story happens","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x17","tag":"쉬운 말","front":"pace","sub":"전개 속도  ·  이 말 없이: pace, pacing, tempo, rhythm","back":"how fast or slow the story moves","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x18","tag":"쉬운 말","front":"first-person narration","sub":"1인칭 시점  ·  이 말 없이: narration, narrator, person","back":"the story is told by 'I', so the reader hears one voice","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x19","tag":"쉬운 말","front":"theme","sub":"주제  ·  이 말 없이: theme, thematic","back":"the big idea under the story","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x20","tag":"쉬운 말","front":"to revise","sub":"퇴고하다  ·  이 말 없이: revise, revision, edit","back":"to go back to my writing and make it better","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x21","tag":"쉬운 말","front":"reserve a table","sub":"자리를 예약하다  ·  이 말 없이: reserve, reservation, book a table","back":"ask them to keep a table for us","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x22","tag":"쉬운 말","front":"jet lag","sub":"시차 적응이 안 된 상태  ·  이 말 없이: jet, lag","back":"the tired feeling after a long flight, when your body still thinks it's night","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x23","tag":"쉬운 말","front":"I'm allergic to it","sub":"알레르기가 있다  ·  이 말 없이: allergy, allergic","back":"if I eat it, my body gets sick","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x24","tag":"쉬운 말","front":"refund","sub":"환불  ·  이 말 없이: refund","back":"they give me my money back","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x25","tag":"쉬운 말","front":"a coming-of-age story","sub":"성장소설  ·  이 말 없이: coming-of-age, coming of age, bildungsroman","back":"a story about a young person who grows up and changes","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"x26","tag":"쉬운 말","front":"the audience for this book","sub":"이 책의 독자층  ·  이 말 없이: audience, demographic, readership","back":"the kind of people who will read this book","tip":"어려운 단어 하나를 쓰지 않고 끝까지 가는 것이 목적입니다.","w":2},{"id":"d1#1","tag":"대화","front":"반갑다고 인사하고, 영어가 서툴러서 천천히 말하겠다고 미리 말해보세요.","sub":"문학 페스티벌, 첫 인사","back":"Nice to meet you, Clara. My English is not very good, so I'll go slowly.","tip":"","w":2},{"id":"d1#3","tag":"대화","front":"소설을 쓴다고 말하고, 지금 쓰고 있는 작품이 무엇에 관한 것인지 한 문장으로 말해보세요.","sub":"문학 페스티벌, 첫 인사","back":"I write novels. Right now I'm working on a book about a woman who goes back to her old town.","tip":"","w":2},{"id":"d1#5","tag":"대화","front":"몇 번째 책인지 말하고, 쓰는 데 얼마나 걸렸는지 덧붙여보세요.","sub":"문학 페스티벌, 첫 인사","back":"No, it's my fourth book. It took me about three years to write it.","tip":"","w":2},{"id":"d1#7","tag":"대화","front":"동의하면서, 왜 그렇게 오래 걸렸는지 이유를 because 로 붙여 말해보세요.","sub":"문학 페스티벌, 첫 인사","back":"Yes, it was long. It took time because I changed the ending three times.","tip":"","w":2},{"id":"d2#1","tag":"대화","front":"'주제(theme)'라는 단어를 쓰지 말고, 이 책의 큰 생각이 무엇인지 쉬운 말로 설명해보세요.","sub":"편집자 미팅 — 내 소설 설명하기","back":"The big idea under the story is memory. I want to ask how much of our old life is real.","tip":"","w":2},{"id":"d2#3","tag":"대화","front":"인물을 두 문장으로 설명하세요. quiet, sad, strong 같은 쉬운 형용사 + who 를 써보세요.","sub":"편집자 미팅 — 내 소설 설명하기","back":"She is a quiet woman who lost her mother when she was young. She looks strong, but inside she is still a child.","tip":"","w":2},{"id":"d2#5","tag":"대화","front":"결말을 다 말하지 않으면서, '열린 결말'이라는 것을 쉬운 말로 설명해보세요.","sub":"편집자 미팅 — 내 소설 설명하기","back":"I can say a little. The ending doesn't tell you what really happened. I want the reader to make it in their own head.","tip":"","w":2},{"id":"d2#7","tag":"대화","front":"승낙하되, 번역가와 확인이 필요하다는 조건을 붙여보세요.","sub":"편집자 미팅 — 내 소설 설명하기","back":"Yes, I'd like that. I need to ask my translator first, but I can send it next week.","tip":"","w":2},{"id":"d3#1","tag":"대화","front":"비행이 길었다고 하고, jet lag 라는 말을 쓰지 말고 지금 몸 상태를 설명해보세요.","sub":"저녁 식사 — 일상 잡담","back":"It was long — about twelve hours. I'm still tired, and my body thinks it's night now.","tip":"","w":2},{"id":"d3#3","tag":"대화","front":"고기를 못 먹는다고 말하고(vegetarian 이라는 단어 없이), 대신 무엇을 먹고 싶은지 말해보세요.","sub":"저녁 식사 — 일상 잡담","back":"Thank you, but I don't eat meat. Is there something with vegetables? Or I can have the fish, that's fine.","tip":"","w":2},{"id":"d3#5","tag":"대화","front":"두세 문장으로 답하세요. because 를 한 번 넣으세요.","sub":"저녁 식사 — 일상 잡담","back":"I walk a lot. I like walking in the early morning because the city is quiet then.","tip":"","w":2},{"id":"d3#7","tag":"대화","front":"웃으며 동의하고, 왜 조용한 이야기를 쓰는지 한 문장으로 덧붙이세요.","sub":"저녁 식사 — 일상 잡담","back":"Maybe you're right. I think quiet people have the biggest stories inside.","tip":"","w":2},{"id":"d4#1","tag":"대화","front":"생각할 시간을 버는 문장으로 시작한 다음, 이유를 두 문장으로 말해보세요.","sub":"낭독회 Q&A — 독자의 질문","back":"That's a big question. Let me think. I write because there are things I can't say out loud, and writing is the only place I can say them.","tip":"","w":2},{"id":"d4#3","tag":"대화","front":"yes/no 를 먼저 말하고, '번역'이라는 단어를 써서 설명해보세요.","sub":"낭독회 Q&A — 독자의 질문","back":"Yes, I think so. A translation is a new book in some way. The words change, but I hope the feeling stays the same.","tip":"","w":2},{"id":"d4#5","tag":"대화","front":"어떤 부분이 어려웠는지 말하고, 왜 어려웠는지 붙이세요.","sub":"낭독회 Q&A — 독자의 질문","back":"The last chapter was the hardest. I wrote it seven times, because I didn't want to give an easy answer.","tip":"","w":2},{"id":"d4#7","tag":"대화","front":"짧고 단순한 조언 한두 문장. 어려운 단어를 쓰지 마세요.","sub":"낭독회 Q&A — 독자의 질문","back":"Write badly first. A bad page is still a page, and nothing comes from an empty desk.","tip":"","w":2},{"id":"d5#1","tag":"대화","front":"예약이 있다고 말하고, 누가 예약했는지(출판사) 설명해보세요.","sub":"호텔과 길 위에서","back":"I have a room here for two nights. The publishing house made it for me — maybe it's under their name.","tip":"","w":2},{"id":"d5#3","tag":"대화","front":"확인하고, 조식이 몇 시부터인지 물어보세요.","sub":"호텔과 길 위에서","back":"Great, thank you. What time does breakfast start?","tip":"","w":2},{"id":"d5#5","tag":"대화","front":"내일 아침 서점까지 걸어갈 수 있는지 물어보세요.","sub":"호텔과 길 위에서","back":"Yes — one more thing. Can I walk to the bookshop from here, or is it too far?","tip":"","w":2},{"id":"d6#1","tag":"대화","front":"바로 답하지 말고, 제대로 이해했는지 확인하는 문장으로 되물으세요.","sub":"계약 이야기 — 조심스럽게 미루기","back":"Let me see if I understand. You want me to make the book about fifty pages shorter?","tip":"","w":2},{"id":"d6#3","tag":"대화","front":"동의하지 않는 부분이 있다고 부드럽게 말하고, 그 부분이 왜 필요한지 설명하세요.","sub":"계약 이야기 — 조심스럽게 미루기","back":"I understand, but I think a little differently. The middle is slow because the woman is waiting, and the reader has to feel that waiting too.","tip":"","w":2},{"id":"d6#5","tag":"대화","front":"바로 결정하지 않고 시간을 달라고 요청하세요. 언제까지 답하겠다고 말하세요.","sub":"계약 이야기 — 조심스럽게 미루기","back":"Yes, I can do that. Can I think about it and write to you in two weeks?","tip":"","w":2}],"tools":[{"w":"a kind of ...","kr":"일종의 ~","note":"돌려 말하기 도구 ①. It's a kind of story about ..."},{"w":"something like ...","kr":"~같은 것","note":"돌려 말하기 도구 ②. It's something like a diary."},{"w":"the opposite of ...","kr":"~의 반대","note":"돌려 말하기 도구 ③. 모르는 단어를 아는 단어의 반대로 설명."},{"w":"the person who ... / the thing that ...","kr":"~하는 사람 / ~하는 것","note":"돌려 말하기 도구 ④. 명사를 통째로 만들어낸다."},{"w":"the feeling when ...","kr":"~할 때의 느낌","note":"돌려 말하기 도구 ⑤. 모든 감정 단어를 대신한다."},{"w":"used for / used to ...","kr":"~에 쓰이는","note":"돌려 말하기 도구 ⑥. 사물 설명."},{"w":"in other words / I mean ...","kr":"다시 말해 / 제 말은","note":"돌려 말하기 도구 ⑦. 첫 시도가 실패해도 두 번째 기회를 만든다."},{"w":"How do you say ...?","kr":"~를 뭐라고 하죠?","note":"돌려 말하기 도구 ⑧. 모른다고 멈추는 대신 상대를 끌어들인다."}],"core":[{"w":"be / is / are / was","kr":"이다, 있다","note":"모든 설명의 기본틀. It is / There is 로 시작하면 일단 문장이 나온다."},{"w":"have","kr":"가지다, 있다","note":"I have a question. / We have time. 소유가 아니어도 널리 쓴다."},{"w":"do","kr":"하다","note":"What do you do? / I didn't do it. 동사가 안 떠오르면 do + 명사."},{"w":"get","kr":"얻다, 되다, 도착하다","note":"만능. get an idea / get tired / get there. 어려운 동사의 90%를 대신한다."},{"w":"make","kr":"만들다, ~하게 하다","note":"make a decision(결정하다), make me sad(슬프게 하다). '동사'가 막히면 make + 명사."},{"w":"take","kr":"가지다, 걸리다, 데려가다","note":"It takes time. / take a walk / take a look."},{"w":"give","kr":"주다","note":"give an example / give me a minute."},{"w":"go / come","kr":"가다 / 오다","note":"go on(계속되다), come out(나오다·출간되다)."},{"w":"put","kr":"놓다, 두다","note":"put it in the book / put it another way(다르게 말하면)."},{"w":"say / tell / talk / ask","kr":"말하다 / 알려주다 / 이야기하다 / 묻다","note":"say + 말, tell + 사람, talk about + 주제, ask 사람 for 것."},{"w":"want / need","kr":"원하다 / 필요하다","note":"I want to say ... 로 시작하면 하고 싶은 말 대부분이 열린다."},{"w":"think / know / feel","kr":"생각하다 / 알다 / 느끼다","note":"I think ... 는 틀릴까 봐 두려울 때의 안전벨트."},{"w":"like","kr":"좋아하다 / ~같은","note":"둘 다 된다. It's like a dream. 돌려 말하기의 1번 도구."},{"w":"mean","kr":"의미하다","note":"I mean ... / What do you mean? 대화가 꼬일 때 되돌리는 손잡이."},{"w":"try / keep / start / stop","kr":"해보다 / 계속하다 / 시작하다 / 멈추다","note":"I'm trying to ... 는 실력을 넘어선 말을 할 때 쓰는 방패."},{"w":"work","kr":"일하다, 작품, 작동하다","note":"my work(내 작품) / it works(그게 잘 된다). 명사·동사 둘 다."},{"w":"write / read","kr":"쓰다 / 읽다","note":"a writer, a reader, writing, reading — 한 뿌리에서 네 단어."},{"w":"see / look / hear / find","kr":"보다 / 보이다 / 듣다 / 찾다","note":"I see.(알겠어요) 는 가장 값싼 맞장구."},{"w":"help / let / show / meet","kr":"돕다 / ~하게 두다 / 보여주다 / 만나다","note":"Let me think. / Let me try again."},{"w":"live / happen / change / stay","kr":"살다 / 일어나다 / 바뀌다 / 머무르다","note":"something that really happened(실제로 있었던 일)."},{"w":"thing / something / anything / nothing","kr":"것 / 무언가 / 아무거나 / 아무것도","note":"단어가 없으면 thing 으로 버틴다. the thing that ... 로 설명을 잇는다."},{"w":"people / person / someone / who","kr":"사람들 / 사람 / 누군가 / 누구","note":"the person who ... 는 직업·역할을 설명하는 만능 틀."},{"w":"time / day / year / moment","kr":"시간 / 날 / 해 / 순간","note":"the time when ... 로 시대·시점을 설명."},{"w":"way / kind / part / reason","kr":"방식 / 종류 / 부분 / 이유","note":"the way you write(당신이 쓰는 방식), a kind of ...(일종의)."},{"w":"word / line / page / name","kr":"단어 / 줄 / 쪽 / 이름","note":"in other words(다시 말해)."},{"w":"book / story / novel / chapter","kr":"책 / 이야기 / 소설 / 장","note":"작품 얘기의 기본 4단어."},{"w":"writer / reader / editor / translator","kr":"작가 / 독자 / 편집자 / 번역가","note":"모르는 직함은 the person who ... 로 풀면 된다."},{"w":"idea / question / answer / problem","kr":"생각 / 질문 / 답 / 문제","note":"That's a good question. 은 생각할 시간을 버는 문장."},{"w":"feeling / life / memory / dream","kr":"감정 / 삶 / 기억 / 꿈","note":"추상어는 대부분 이 넷 + 형용사로 풀린다."},{"w":"place / city / country / home","kr":"장소 / 도시 / 나라 / 집","note":""},{"w":"food / coffee / water / money","kr":"음식 / 커피 / 물 / 돈","note":""},{"w":"good / bad / new / old","kr":"좋은 / 나쁜 / 새로운 / 오래된","note":"강조는 really, very 하나면 충분하다."},{"w":"big / small / long / short","kr":"큰 / 작은 / 긴 / 짧은","note":""},{"w":"easy / hard / slow / fast","kr":"쉬운 / 어려운 / 느린 / 빠른","note":"It's hard to say.(말하기 어렵네요)"},{"w":"same / different / important / strange","kr":"같은 / 다른 / 중요한 / 이상한","note":"different from ...(~와 다른) 는 비교의 기본."},{"w":"quiet / loud / happy / sad","kr":"조용한 / 시끄러운 / 행복한 / 슬픈","note":"감정 형용사는 이 네 개로 시작해 조합한다: a quiet sad feeling."},{"w":"true / real / clear / simple","kr":"진짜인 / 실제의 / 분명한 / 단순한","note":""},{"w":"sure / ready / free / tired","kr":"확신하는 / 준비된 / 한가한 / 피곤한","note":"I'm not sure. 는 모름을 말하는 가장 자연스러운 방법."},{"w":"because / but / so / if","kr":"왜냐하면 / 그러나 / 그래서 / 만약","note":"이 네 개가 문장을 길게 만든다. 짧은 문장 + because 가 유창함의 시작."},{"w":"when / before / after / while","kr":"~할 때 / 전에 / 후에 / ~하는 동안","note":""},{"w":"about / with / without / for","kr":"~에 대해 / ~와 함께 / ~없이 / ~를 위해","note":"My book is about ... 는 작품 소개의 첫 문장."},{"w":"more / most / than / also","kr":"더 / 가장 / ~보다 / 또한","note":""},{"w":"maybe / almost / only / even","kr":"아마 / 거의 / 오직 / 심지어","note":"maybe 는 확신 없는 말을 부드럽게 만든다."},{"w":"always / often / sometimes / never","kr":"항상 / 자주 / 가끔 / 결코","note":""}],"patterns":[{"id":"p01","kr":"제 말은, 제가 하고 싶은 말은 이거예요.","en":"What I want to say is this."},{"id":"p02","kr":"지금 새 소설을 쓰고 있어요.","en":"I'm working on a new novel."},{"id":"p03","kr":"제 책은 기억에 관한 이야기예요.","en":"My book is about memory."},{"id":"p04","kr":"한 문장으로 말하면, 집을 잃은 여자에 관한 이야기예요.","en":"In one sentence, it's a story about a woman who lost her home."},{"id":"p05","kr":"그 단어가 무슨 뜻인지 잘 모르겠어요.","en":"I'm not sure what that word means."},{"id":"p06","kr":"조금만 천천히 다시 말해 주실 수 있어요?","en":"Could you say that again, a little more slowly?"},{"id":"p07","kr":"미안해요, 못 알아들었어요.","en":"Sorry, I didn't catch that."},{"id":"p08","kr":"잠깐만요, 생각 좀 할게요.","en":"Wait a moment — let me think."},{"id":"p09","kr":"그거 영어로 뭐라고 하죠? 사람을 오래 슬프게 하는 그런 느낌인데요.","en":"How do you say it in English? It's the feeling when you stay sad for a long time."},{"id":"p10","kr":"쓰는 데 삼 년 걸렸어요.","en":"It took me three years to write it."},{"id":"p11","kr":"그 부분이 저한테는 제일 어려웠어요.","en":"That part was the hardest for me."},{"id":"p12","kr":"저는 보통 아침에 써요, 조용하니까요.","en":"I usually write in the morning, because it's quiet."},{"id":"p13","kr":"글이 안 써지는 날도 있어요. 그럴 땐 그냥 걸어요.","en":"Some days nothing comes. On those days I just walk."},{"id":"p14","kr":"번역본이 내년에 나와요.","en":"The translation is coming out next year."},{"id":"p15","kr":"당신 책 읽었어요. 정말 좋았어요.","en":"I read your book. I really liked it."},{"id":"p16","kr":"특히 마지막 장이 오래 남았어요.","en":"The last chapter stayed with me for a long time."},{"id":"p17","kr":"저는 그렇게 생각하지 않아요. 제 생각엔 좀 다른 것 같아요.","en":"I don't think so. I think it's a little different."},{"id":"p18","kr":"예를 하나 들어도 될까요?","en":"Can I give you an example?"},{"id":"p19","kr":"제 인물들은 대부분 말이 없는 사람들이에요.","en":"Most of my characters are quiet people."},{"id":"p20","kr":"이 이야기는 실제로 있었던 일에서 시작됐어요.","en":"This story started from something that really happened."},{"id":"p21","kr":"제 영어가 좋지 않아요. 천천히 갈게요.","en":"My English is not good, so I'll go slowly."},{"id":"p22","kr":"그렇게 말해줘서 고마워요.","en":"Thank you for saying that."},{"id":"p23","kr":"다음 주에 이 얘기 다시 해도 될까요?","en":"Can we talk about this again next week?"},{"id":"p24","kr":"메일 주소 알려주실 수 있어요?","en":"Could you give me your email?"},{"id":"p25","kr":"저는 고기를 안 먹어요. 채소만 먹어요.","en":"I don't eat meat. I only eat vegetables."},{"id":"p26","kr":"물 한 잔만 주시겠어요?","en":"Could I have a glass of water, please?"},{"id":"p27","kr":"한 시간쯤 늦을 것 같아요.","en":"I think I'll be about an hour late."},{"id":"p28","kr":"비행이 길어서 아직 몸이 밤인 것 같아요.","en":"It was a long flight, so my body still thinks it's night."},{"id":"p29","kr":"제가 제대로 이해했는지 볼게요. 그러니까 이 부분을 줄이자는 말씀이죠?","en":"Let me see if I understand. So you want me to make this part shorter?"},{"id":"p30","kr":"그건 제가 생각한 것과 좀 달라요. 조금 더 생각해볼게요.","en":"That's a little different from what I thought. Let me think about it more."}],"paraphrase":[{"id":"x01","term":"melancholy","kr":"멜랑콜리, 우수","model":"a quiet sad feeling that stays with you for a long time"},{"id":"x02","term":"narrative structure","kr":"서사 구조","model":"the way a story is put together"},{"id":"x03","term":"protagonist","kr":"주인공","model":"the main person in the story"},{"id":"x04","term":"metaphor","kr":"은유","model":"when you say one thing but you mean another thing"},{"id":"x05","term":"first draft","kr":"초고","model":"the first writing, before I make it better"},{"id":"x06","term":"deadline","kr":"마감","model":"the last day I can give them my work"},{"id":"x07","term":"royalties","kr":"인세","model":"the money a writer gets from every book they sell"},{"id":"x08","term":"literary agent","kr":"에이전트","model":"the person who sells my book to publishers for me"},{"id":"x09","term":"publisher","kr":"출판사","model":"a company that makes and sells books"},{"id":"x10","term":"ambiguous ending","kr":"열린 결말","model":"an ending that doesn't tell you what really happened"},{"id":"x11","term":"autobiographical","kr":"자전적인","model":"the story comes from my own life"},{"id":"x12","term":"nostalgia","kr":"노스탤지어, 향수","model":"the warm sad feeling when you miss a time that is gone"},{"id":"x13","term":"irony","kr":"아이러니","model":"when what happens is the opposite of what you expect"},{"id":"x14","term":"translation rights","kr":"번역 판권","model":"when a country can make my book in their own language"},{"id":"x15","term":"writer's block","kr":"슬럼프, 글이 안 써지는 때","model":"the days when I sit down and nothing comes"},{"id":"x16","term":"the setting of a novel","kr":"작품의 배경","model":"the place and the time where the story happens"},{"id":"x17","term":"pace","kr":"전개 속도","model":"how fast or slow the story moves"},{"id":"x18","term":"first-person narration","kr":"1인칭 시점","model":"the story is told by 'I', so the reader hears one voice"},{"id":"x19","term":"theme","kr":"주제","model":"the big idea under the story"},{"id":"x20","term":"to revise","kr":"퇴고하다","model":"to go back to my writing and make it better"},{"id":"x21","term":"reserve a table","kr":"자리를 예약하다","model":"ask them to keep a table for us"},{"id":"x22","term":"jet lag","kr":"시차 적응이 안 된 상태","model":"the tired feeling after a long flight, when your body still thinks it's night"},{"id":"x23","term":"I'm allergic to it","kr":"알레르기가 있다","model":"if I eat it, my body gets sick"},{"id":"x24","term":"refund","kr":"환불","model":"they give me my money back"},{"id":"x25","term":"a coming-of-age story","kr":"성장소설","model":"a story about a young person who grows up and changes"},{"id":"x26","term":"the audience for this book","kr":"이 책의 독자층","model":"the kind of people who will read this book"}],"dialogues":[{"title":"문학 페스티벌, 첫 인사","turns":[{"kr":"반갑다고 인사하고, 영어가 서툴러서 천천히 말하겠다고 미리 말해보세요.","model":"Nice to meet you, Clara. My English is not very good, so I'll go slowly."},{"kr":"소설을 쓴다고 말하고, 지금 쓰고 있는 작품이 무엇에 관한 것인지 한 문장으로 말해보세요.","model":"I write novels. Right now I'm working on a book about a woman who goes back to her old town."},{"kr":"몇 번째 책인지 말하고, 쓰는 데 얼마나 걸렸는지 덧붙여보세요.","model":"No, it's my fourth book. It took me about three years to write it."},{"kr":"동의하면서, 왜 그렇게 오래 걸렸는지 이유를 because 로 붙여 말해보세요.","model":"Yes, it was long. It took time because I changed the ending three times."}]},{"title":"편집자 미팅 — 내 소설 설명하기","turns":[{"kr":"'주제(theme)'라는 단어를 쓰지 말고, 이 책의 큰 생각이 무엇인지 쉬운 말로 설명해보세요.","model":"The big idea under the story is memory. I want to ask how much of our old life is real."},{"kr":"인물을 두 문장으로 설명하세요. quiet, sad, strong 같은 쉬운 형용사 + who 를 써보세요.","model":"She is a quiet woman who lost her mother when she was young. She looks strong, but inside she is still a child."},{"kr":"결말을 다 말하지 않으면서, '열린 결말'이라는 것을 쉬운 말로 설명해보세요.","model":"I can say a little. The ending doesn't tell you what really happened. I want the reader to make it in their own head."},{"kr":"승낙하되, 번역가와 확인이 필요하다는 조건을 붙여보세요.","model":"Yes, I'd like that. I need to ask my translator first, but I can send it next week."}]},{"title":"저녁 식사 — 일상 잡담","turns":[{"kr":"비행이 길었다고 하고, jet lag 라는 말을 쓰지 말고 지금 몸 상태를 설명해보세요.","model":"It was long — about twelve hours. I'm still tired, and my body thinks it's night now."},{"kr":"고기를 못 먹는다고 말하고(vegetarian 이라는 단어 없이), 대신 무엇을 먹고 싶은지 말해보세요.","model":"Thank you, but I don't eat meat. Is there something with vegetables? Or I can have the fish, that's fine."},{"kr":"두세 문장으로 답하세요. because 를 한 번 넣으세요.","model":"I walk a lot. I like walking in the early morning because the city is quiet then."},{"kr":"웃으며 동의하고, 왜 조용한 이야기를 쓰는지 한 문장으로 덧붙이세요.","model":"Maybe you're right. I think quiet people have the biggest stories inside."}]},{"title":"낭독회 Q&A — 독자의 질문","turns":[{"kr":"생각할 시간을 버는 문장으로 시작한 다음, 이유를 두 문장으로 말해보세요.","model":"That's a big question. Let me think. I write because there are things I can't say out loud, and writing is the only place I can say them."},{"kr":"yes/no 를 먼저 말하고, '번역'이라는 단어를 써서 설명해보세요.","model":"Yes, I think so. A translation is a new book in some way. The words change, but I hope the feeling stays the same."},{"kr":"어떤 부분이 어려웠는지 말하고, 왜 어려웠는지 붙이세요.","model":"The last chapter was the hardest. I wrote it seven times, because I didn't want to give an easy answer."},{"kr":"짧고 단순한 조언 한두 문장. 어려운 단어를 쓰지 마세요.","model":"Write badly first. A bad page is still a page, and nothing comes from an empty desk."}]},{"title":"호텔과 길 위에서","turns":[{"kr":"예약이 있다고 말하고, 누가 예약했는지(출판사) 설명해보세요.","model":"I have a room here for two nights. The publishing house made it for me — maybe it's under their name."},{"kr":"확인하고, 조식이 몇 시부터인지 물어보세요.","model":"Great, thank you. What time does breakfast start?"},{"kr":"내일 아침 서점까지 걸어갈 수 있는지 물어보세요.","model":"Yes — one more thing. Can I walk to the bookshop from here, or is it too far?"}]},{"title":"계약 이야기 — 조심스럽게 미루기","turns":[{"kr":"바로 답하지 말고, 제대로 이해했는지 확인하는 문장으로 되물으세요.","model":"Let me see if I understand. You want me to make the book about fifty pages shorter?"},{"kr":"동의하지 않는 부분이 있다고 부드럽게 말하고, 그 부분이 왜 필요한지 설명하세요.","model":"I understand, but I think a little differently. The middle is slow because the woman is waiting, and the reader has to feel that waiting too."},{"kr":"바로 결정하지 않고 시간을 달라고 요청하세요. 언제까지 답하겠다고 말하세요.","model":"Yes, I can do that. Can I think about it and write to you in two weeks?"}]}],"allowed":["a","about","after","again","ago","all","almost","already","also","always","am","an","and","another","answer","any","anything","are","around","as","ask","asked","at","away","back","bad","be","because","become","been","before","begin","best","better","big","bit","book","both","bring","but","buy","by","call","came","can","car","change","chapter","city","clear","close","coffee","cold","come","country","could","day","days","did","die","different","dinner","do","does","doing","done","down","dream","drink","each","early","easy","eat","editor","end","enough","even","ever","every","everything","example","eye","face","fact","far","fast","feel","feeling","few","find","fine","first","food","for","free","friend","from","full","funny","get","give","go","going","good","got","great","had","half","hand","happen","happy","hard","has","have","he","head","hear","help","her","here","hey","high","him","his","home","hope","hotel","hour","house","how","i","idea","if","in","into","is","it","its","just","keep","kind","know","land","language","last","late","later","learn","leave","less","let","letter","life","like","line","listen","little","live","long","look","lose","lot","loud","love","made","make","man","many","market","may","maybe","me","mean","meet","memory","might","mind","minute","miss","moment","money","month","more","morning","most","mother","move","much","music","must","my","name","near","need","never","new","news","next","nice","night","no","not","nothing","novel","now","of","off","often","oh","ok","old","on","once","one","only","open","opposite","or","other","our","out","over","own","page","paper","part","pay","people","perhaps","person","phone","picture","place","play","please","point","poor","put","question","quiet","quite","read","reader","ready","real","really","reason","remem n","gift","girl","glass","gone","grandmother","green","grow","guess","hair","hall","hand","happen","hate","head","heart","heavy","hello","help","hi","hide","hold","hole","holiday","hope","hospital","hot","hotel","hour","hundred","hungry","hurt","ice","idea","ill","imagine","include","inside","interest","interesting","invite","island","job","join","joke","keep","key","kill","kind","kitchen","knee","knock","lake","land","large","last","late","laugh","lead","learn","leave","left","leg","less","letter","library","lie","light","list","listen","little","lock","lonely","lose","lost","loud","love","low","luck","lunch","machine","main","map","mark","market","marry","meal","mean","meat","medicine","meet","member","middle","milk","mind","minute","mirror","miss","mistake","moment","money","month","moon","morning","mother","mountain","mouth","move","music","nature","near","neck","need","never","news","newspaper","next","nice","night","nobody","noise","north","nose","note","notice","number","nurse","ocean","office","often","oil","once","open","order","other","outside","own","pain","paint","pair","paper","parent","park","party","pass","past","pay","peace","pen","perhaps","phone","photo","pick","picture","piece","plan","plane","plant","plate","play","please","pocket","point","police","poor","possible","post","pot","practice","present","press","pretty","price","print","prize","promise","publish","publisher","pull","push","quick","quiet","radio","rain","reach","record","red","remember","repeat","rest","return","rich","ride","ring","rise","river","road","rock","roof","room","rope","round","rule","run","safe","sample","sand","save","scene","school","science","sea","seat","second","secret","seem","sell","send","sentence","serious","seven","several","shape","share","sharp","she","ship","shoe","shop","short","shoulder","shout","show","shut","sick","side","sign","silence","silver","simple","since","sing","sister","sit","six","size","skin","sky","sleep","smell","smile","smoke","snow","soft","soldier","son","song","soon","sorry","sound","soup","south","space","speak","special","spend","spring","stand","star","start","station","stay","step","stick","still","stone","stop","store","storm","straight","strange","street","strong","student","study","stupid","subject","success","sudden","sugar","summer","sun","sure","surprise","sweet","swim","system","table","tail","take","talk","tall","taste","teach","teacher","team","tear","telephone","television","tell","temperature","ten","test","than","thank","theater","thick","thin","thing","think","third","thirsty","thought","three","throw","ticket","tie","tired","today","together","told","tomorrow","tonight","took","tool","tooth","top","touch","toward","town","train","travel","tree","trip","trouble","true","trust","truth","try","turn","twelve","twenty","two","ugly","uncle","understand","university","until","usual","vegetable","very","village","visit","voice","wait","wake","walk","wall","want","war","warm","wash","watch","water","weak","wear","weather","wedding","week","weight","welcome","well","west","wet","wheel","white","whole","wide","wife","wild","win","wind","window","wine","winter","wish","woman","wonder","wood","word","world","worry","worse","write","wrong","wrote","yellow","yesterday","young"],"essay":"\u003ch2>이 단계를 어떻게 쓸 것인가\u003c/h2>\u003cp class=\"dek\">1단계 · 막히지 않고 이어가기 — 300단어의 뼈대\u003c/p>\u003cp>어려운 단어가 떠오르지 않아도 문장이 끊기지 않게 만든다. 쉬운 단어로 돌려 말하는 회로를 몸에 붙이는 단계.\u003c/p>\u003cp>영어가 막히는 순간은 대개 문법이 무너져서가 아닙니다. \u003cb>단어 하나가 안 떠올라서\u003c/b>입니다. 그 한 단어를 기다리는 2초 동안 문장이 무너지고, 무너진 문장을 수습하려다 말 전체를 포기하게 됩니다. 이 단계의 훈련은 그 2초를 없애는 것입니다. 단어를 더 아는 방식이 아니라, \u003cb>없는 단어를 지나쳐 가는 방식\u003c/b>으로요.\u003c/p>\u003cp>포켓북은 소리 없이 쓰는 물건입니다. 지하철에서, 줄을 서면서, 엘리베이터에서. 다만 한 가지만 지켜주세요 — \u003cb>눈으로 읽지 말고 입 모양으로 말하세요.\u003c/b> 소리를 내지 않아도 됩니다. 입술과 혀가 움직이기만 하면 됩니다. 눈으로만 읽은 문장은 입으로 나오지 않습니다. 이건 취향의 문제가 아니라 몸의 문제입니다.\u003c/p>\u003cp>카드는 뒤집기 전에 \u003cb>반드시 먼저 시도\u003c/b>하세요. 3초 안에 안 나오면 그건 \"막힌 것\"입니다. 봐서 아는 것과 떠올릴 수 있는 것은 완전히 다른 능력이고, 실전에서 필요한 건 뒤쪽입니다.\u003c/p>\u003ch2>돌려 말하기 도구\u003c/h2>\u003cp>이 8개가 이 앱 전체의 엔진입니다. 모르는 단어가 나왔을 때 멈추는 대신 이 틀 중 하나를 꺼내면, 아는 단어만으로 그 자리를 메울 수 있습니다. 외우려 하지 말고, 하루에 하나씩 실제로 써보세요.\u003c/p>\u003col class=\"tools\">\u003cli>\u003cdiv class=\"en\">a kind of ...\u003c/div>\u003cdiv class=\"kr\">일종의 ~\u003c/div>\u003cp>돌려 말하기 도구 ①. It's a kind of story about ...\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">something like ...\u003c/div>\u003cdiv class=\"kr\">~같은 것\u003c/div>\u003cp>돌려 말하기 도구 ②. It's something like a diary.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">the opposite of ...\u003c/div>\u003cdiv class=\"kr\">~의 반대\u003c/div>\u003cp>돌려 말하기 도구 ③. 모르는 단어를 아는 단어의 반대로 설명.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">the person who ... / the thing that ...\u003c/div>\u003cdiv class=\"kr\">~하는 사람 / ~하는 것\u003c/div>\u003cp>돌려 말하기 도구 ④. 명사를 통째로 만들어낸다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">the feeling when ...\u003c/div>\u003cdiv class=\"kr\">~할 때의 느낌\u003c/div>\u003cp>돌려 말하기 도구 ⑤. 모든 감정 단어를 대신한다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">used for / used to ...\u003c/div>\u003cdiv class=\"kr\">~에 쓰이는\u003c/div>\u003cp>돌려 말하기 도구 ⑥. 사물 설명.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">in other words / I mean ...\u003c/div>\u003cdiv class=\"kr\">다시 말해 / 제 말은\u003c/div>\u003cp>돌려 말하기 도구 ⑦. 첫 시도가 실패해도 두 번째 기회를 만든다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">How do you say ...?\u003c/div>\u003cdiv class=\"kr\">~를 뭐라고 하죠?\u003c/div>\u003cp>돌려 말하기 도구 ⑧. 모른다고 멈추는 대신 상대를 끌어들인다.\u003c/p>\u003c/li>\u003c/ol>\u003ch2>단어 하나가 여럿을 대신한다\u003c/h2>\u003cp>아래는 이 단계의 핵심 단어들이 실제로 어떻게 쓰이는지에 대한 메모입니다. 뜻을 외우는 칸이 아니라, \u003cb>쓰임을 보는 칸\u003c/b>입니다.\u003c/p>\u003cdl>\u003cdt>be / is / are / was \u003cspan>이다, 있다\u003c/span>\u003c/dt>\u003cdd>모든 설명의 기본틀. It is / There is 로 시작하면 일단 문장이 나온다.\u003c/dd>\u003cdt>have \u003cspan>가지다, 있다\u003c/span>\u003c/dt>\u003cdd>I have a question. / We have time. 소유가 아니어도 널리 쓴다.\u003c/dd>\u003cdt>do \u003cspan>하다\u003c/span>\u003c/dt>\u003cdd>What do you do? / I didn't do it. 동사가 안 떠오르면 do + 명사.\u003c/dd>\u003cdt>get \u003cspan>얻다, 되다, 도착하다\u003c/span>\u003c/dt>\u003cdd>만능. get an idea / get tired / get there. 어려운 동사의 90%를 대신한다.\u003c/dd>\u003cdt>make \u003cspan>만들다, ~하게 하다\u003c/span>\u003c/dt>\u003cdd>make a decision(결정하다), make me sad(슬프게 하다). '동사'가 막히면 make + 명사.\u003c/dd>\u003cdt>take \u003cspan>가지다, 걸리다, 데려가다\u003c/span>\u003c/dt>\u003cdd>It takes time. / take a walk / take a look.\u003c/dd>\u003cdt>give \u003cspan>주다\u003c/span>\u003c/dt>\u003cdd>give an example / give me a minute.\u003c/dd>\u003cdt>go / come \u003cspan>가다 / 오다\u003c/span>\u003c/dt>\u003cdd>go on(계속되다), come out(나오다·출간되다).\u003c/dd>\u003cdt>put \u003cspan>놓다, 두다\u003c/span>\u003c/dt>\u003cdd>put it in the book / put it another way(다르게 말하면).\u003c/dd>\u003cdt>say / tell / talk / ask \u003cspan>말하다 / 알려주다 / 이야기하다 / 묻다\u003c/span>\u003c/dt>\u003cdd>say + 말, tell + 사람, talk about + 주제, ask 사람 for 것.\u003c/dd>\u003cdt>want / need \u003cspan>원하다 / 필요하다\u003c/span>\u003c/dt>\u003cdd>I want to say ... 로 시작하면 하고 싶은 말 대부분이 열린다.\u003c/dd>\u003cdt>think / know / feel \u003cspan>생각하다 / 알다 / 느끼다\u003c/span>\u003c/dt>\u003cdd>I think ... 는 틀릴까 봐 두려울 때의 안전벨트.\u003c/dd>\u003cdt>like \u003cspan>좋아하다 / ~같은\u003c/span>\u003c/dt>\u003cdd>둘 다 된다. It's like a dream. 돌려 말하기의 1번 도구.\u003c/dd>\u003cdt>mean \u003cspan>의미하다\u003c/span>\u003c/dt>\u003cdd>I mean ... / What do you mean? 대화가 꼬일 때 되돌리는 손잡이.\u003c/dd>\u003cdt>try / keep / start / stop \u003cspan>해보다 / 계속하다 / 시작하다 / 멈추다\u003c/span>\u003c/dt>\u003cdd>I'm trying to ... 는 실력을 넘어선 말을 할 때 쓰는 방패.\u003c/dd>\u003cdt>work \u003cspan>일하다, 작품, 작동하다\u003c/span>\u003c/dt>\u003cdd>my work(내 작품) / it works(그게 잘 된다). 명사·동사 둘 다.\u003c/dd>\u003cdt>write / read \u003cspan>쓰다 / 읽다\u003c/span>\u003c/dt>\u003cdd>a writer, a reader, writing, reading — 한 뿌리에서 네 단어.\u003c/dd>\u003cdt>see / look / hear / find \u003cspan>보다 / 보이다 / 듣다 / 찾다\u003c/span>\u003c/dt>\u003cdd>I see.(알겠어요) 는 가장 값싼 맞장구.\u003c/dd>\u003cdt>help / let / show / meet \u003cspan>돕다 / ~하게 두다 / 보여주다 / 만나다\u003c/span>\u003c/dt>\u003cdd>Let me think. / Let me try again.\u003c/dd>\u003cdt>live / happen / change / stay \u003cspan>살다 / 일어나다 / 바뀌다 / 머무르다\u003c/span>\u003c/dt>\u003cdd>something that really happened(실제로 있었던 일).\u003c/dd>\u003cdt>thing / something / anything / nothing \u003cspan>것 / 무언가 / 아무거나 / 아무것도\u003c/span>\u003c/dt>\u003cdd>단어가 없으면 thing 으로 버틴다. the thing that ... 로 설명을 잇는다.\u003c/dd>\u003cdt>people / person / someone / who \u003cspan>사람들 / 사람 / 누군가 / 누구\u003c/span>\u003c/dt>\u003cdd>the person who ... 는 직업·역할을 설명하는 만능 틀.\u003c/dd>\u003cdt>time / day / year / moment \u003cspan>시간 / 날 / 해 / 순간\u003c/span>\u003c/dt>\u003cdd>the time when ... 로 시대·시점을 설명.\u003c/dd>\u003cdt>way / kind / part / reason \u003cspan>방식 / 종류 / 부분 / 이유\u003c/span>\u003c/dt>\u003cdd>the way you write(당신이 쓰는 방식), a kind of ...(일종의).\u003c/dd>\u003cdt>word / line / page / name \u003cspan>단어 / 줄 / 쪽 / 이름\u003c/span>\u003c/dt>\u003cdd>in other words(다시 말해).\u003c/dd>\u003cdt>book / story / novel / chapter \u003cspan>책 / 이야기 / 소설 / 장\u003c/span>\u003c/dt>\u003cdd>작품 얘기의 기본 4단어.\u003c/dd>\u003cdt>writer / reader / editor / translator \u003cspan>작가 / 독자 / 편집자 / 번역가\u003c/span>\u003c/dt>\u003cdd>모르는 직함은 the person who ... 로 풀면 된다.\u003c/dd>\u003cdt>idea / question / answer / problem \u003cspan>생각 / 질문 / 답 / 문제\u003c/span>\u003c/dt>\u003cdd>That's a good question. 은 생각할 시간을 버는 문장.\u003c/dd>\u003cdt>feeling / life / memory / dream \u003cspan>감정 / 삶 / 기억 / 꿈\u003c/span>\u003c/dt>\u003cdd>추상어는 대부분 이 넷 + 형용사로 풀린다.\u003c/dd>\u003cdt>good / bad / new / old \u003cspan>좋은 / 나쁜 / 새로운 / 오래된\u003c/span>\u003c/dt>\u003cdd>강조는 really, very 하나면 충분하다.\u003c/dd>\u003cdt>easy / hard / slow / fast \u003cspan>쉬운 / 어려운 / 느린 / 빠른\u003c/span>\u003c/dt>\u003cdd>It's hard to say.(말하기 어렵네요)\u003c/dd>\u003cdt>same / different / important / strange \u003cspan>같은 / 다른 / 중요한 / 이상한\u003c/span>\u003c/dt>\u003cdd>different from ...(~와 다른) 는 비교의 기본.\u003c/dd>\u003cdt>quiet / loud / happy / sad \u003cspan>조용한 / 시끄러운 / 행복한 / 슬픈\u003c/span>\u003c/dt>\u003cdd>감정 형용사는 이 네 개로 시작해 조합한다: a quiet sad feeling.\u003c/dd>\u003cdt>sure / ready / free / tired \u003cspan>확신하는 / 준비된 / 한가한 / 피곤한\u003c/span>\u003c/dt>\u003cdd>I'm not sure. 는 모름을 말하는 가장 자연스러운 방법.\u003c/dd>\u003cdt>because / but / so / if \u003cspan>왜냐하면 / 그러나 / 그래서 / 만약\u003c/span>\u003c/dt>\u003cdd>이 네 개가 문장을 길게 만든다. 짧은 문장 + because 가 유창함의 시작.\u003c/dd>\u003cdt>about / with / without / for \u003cspan>~에 대해 / ~와 함께 / ~없이 / ~를 위해\u003c/span>\u003c/dt>\u003cdd>My book is about ... 는 작품 소개의 첫 문장.\u003c/dd>\u003cdt>maybe / almost / only / even \u003cspan>아마 / 거의 / 오직 / 심지어\u003c/span>\u003c/dt>\u003cdd>maybe 는 확신 없는 말을 부드럽게 만든다.\u003c/dd>\u003c/dl>\u003ch2>문장을 길게 만드는 법\u003c/h2>\u003cp>짧은 문장은 잘못이 아닙니다. 문제는 짧은 문장 \u003cb>하나로 끝나는 것\u003c/b>입니다. 아래 문장들에 붙은 메모는 대부분 \"여기서 한 마디 더 붙이는 법\"에 관한 것입니다.\u003c/p>\u003cul class=\"tips\">\u003cli>\u003cdiv class=\"en\">What I want to say is this.\u003c/div>\u003cp>막혔을 때 시간을 버는 첫 문장. 이 말을 하는 동안 뒷문장을 만든다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">I'm working on a new novel.\u003c/div>\u003cp>work on 은 '작업 중'을 말하는 가장 흔한 표현.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">My book is about memory.\u003c/div>\u003cp>작품 소개는 A is about B 하나로 시작하면 된다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">In one sentence, it's a story about a woman who lost her home.\u003c/div>\u003cp>the woman who ... 처럼 who 로 인물을 만들어 붙인다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">I'm not sure what that word means.\u003c/div>\u003cp>모른다고 말하는 건 실력 부족이 아니라 대화 기술이다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">Could you say that again, a little more slowly?\u003c/div>\u003cp>이 한 문장이 리스닝 실력의 절반을 대신한다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">Sorry, I didn't catch that.\u003c/div>\u003cp>catch 는 '알아듣다'. 못 들었을 때 가장 짧은 정답.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">Wait a moment — let me think.\u003c/div>\u003cp>침묵보다 훨씬 낫다. 소리 내어 시간을 벌 것.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">How do you say it in English? It's the feeling when you stay sad for a long time.\u003c/div>\u003cp>모르는 단어를 상대에게 물어보며 설명까지 붙이는 이중 기술.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">It took me three years to write it.\u003c/div>\u003cp>It takes + 시간 + to + 동사. 통째로 외운다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">That part was the hardest for me.\u003c/div>\u003cp>part 는 '부분'을 가리키는 만능 명사.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">I usually write in the morning, because it's quiet.\u003c/div>\u003cp>because 를 붙이는 습관이 문장 길이를 두 배로 만든다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">Some days nothing comes. On those days I just walk.\u003c/div>\u003cp>nothing comes 는 어려운 개념을 두 단어로 끝낸 좋은 예.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">The translation is coming out next year.\u003c/div>\u003cp>come out = 출간되다. publish 를 몰라도 된다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">I read your book. I really liked it.\u003c/div>\u003cp>짧게 두 문장. 길게 말하려다 놓치지 말 것.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">The last chapter stayed with me for a long time.\u003c/div>\u003cp>stay with me 는 '여운이 남다'를 쉬운 말로 옮긴 것.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">I don't think so. I think it's a little different.\u003c/div>\u003cp>반대 의견은 I don't think so + because 로 부드럽게.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">Can I give you an example?\u003c/div>\u003cp>설명이 막히면 예시로 도망친다. 항상 통한다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">Most of my characters are quiet people.\u003c/div>\u003cp>character 를 몰라도 the people in my book 으로 대체 가능.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">This story started from something that really happened.\u003c/div>\u003cp>something that ... 구조를 여기서 몸에 붙인다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">My English is not good, so I'll go slowly.\u003c/div>\u003cp>먼저 말해두면 상대가 속도를 맞춰준다. 부끄러운 일이 아니다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">Thank you for saying that.\u003c/div>\u003cp>Thank you for + -ing 는 감사의 만능 틀.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">I don't eat meat. I only eat vegetables.\u003c/div>\u003cp>vegetarian 을 몰라도 이렇게 하면 끝난다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">I think I'll be about an hour late.\u003c/div>\u003cp>about 을 붙이면 정확하지 않아도 안전하다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">It was a long flight, so my body still thinks it's night.\u003c/div>\u003cp>jet lag 를 몰라도 이 문장이면 다 통한다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">Let me see if I understand. So you want me to make this part shorter?\u003c/div>\u003cp>확인 문장은 오해를 막고, 동시에 생각할 시간을 준다.\u003c/p>\u003c/li>\u003cli>\u003cdiv class=\"en\">That's a little different from what I thought. Let me think about it more.\u003c/div>\u003cp>바로 거절하지 않고 시간을 버는 프로의 문장.\u003c/p>\u003c/li>\u003c/ul>\u003ch2>어려운 말 → 쉬운 말 대조표\u003c/h2>\u003cp>왼쪽은 머릿속에 먼저 떠오르는 말이고, 오른쪽은 \u003cb>입에서 실제로 나올 수 있는 말\u003c/b>입니다. 오른쪽을 읽다 보면 어떤 규칙이 보일 겁니다 — 대부분 \u003ci>the ~ who/that/when\u003c/i> 으로 명사를 만들고, 감정은 형용사 두 개를 겹쳐 씁니다.\u003c/p>\u003ctable class=\"cmp\">\u003ctbody>\u003ctr>\u003ctd class=\"l\">melancholy\u003cspan>멜랑콜리, 우수\u003c/span>\u003c/td>\u003ctd class=\"r\">a quiet sad feeling that stays with you for a long time\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">narrative structure\u003cspan>서사 구조\u003c/span>\u003c/td>\u003ctd class=\"r\">the way a story is put together\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">protagonist\u003cspan>주인공\u003c/span>\u003c/td>\u003ctd class=\"r\">the main person in the story\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">metaphor\u003cspan>은유\u003c/span>\u003c/td>\u003ctd class=\"r\">when you say one thing but you mean another thing\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">first draft\u003cspan>초고\u003c/span>\u003c/td>\u003ctd class=\"r\">the first writing, before I make it better\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">deadline\u003cspan>마감\u003c/span>\u003c/td>\u003ctd class=\"r\">the last day I can give them my work\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">royalties\u003cspan>인세\u003c/span>\u003c/td>\u003ctd class=\"r\">the money a writer gets from every book they sell\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">literary agent\u003cspan>에이전트\u003c/span>\u003c/td>\u003ctd class=\"r\">the person who sells my book to publishers for me\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">publisher\u003cspan>출판사\u003c/span>\u003c/td>\u003ctd class=\"r\">a company that makes and sells books\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">ambiguous ending\u003cspan>열린 결말\u003c/span>\u003c/td>\u003ctd class=\"r\">an ending that doesn't tell you what really happened\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">autobiographical\u003cspan>자전적인\u003c/span>\u003c/td>\u003ctd class=\"r\">the story comes from my own life\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">nostalgia\u003cspan>노스탤지어, 향수\u003c/span>\u003c/td>\u003ctd class=\"r\">the warm sad feeling when you miss a time that is gone\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">irony\u003cspan>아이러니\u003c/span>\u003c/td>\u003ctd class=\"r\">when what happens is the opposite of what you expect\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">translation rights\u003cspan>번역 판권\u003c/span>\u003c/td>\u003ctd class=\"r\">when a country can make my book in their own language\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">writer's block\u003cspan>슬럼프, 글이 안 써지는 때\u003c/span>\u003c/td>\u003ctd class=\"r\">the days when I sit down and nothing comes\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">the setting of a novel\u003cspan>작품의 배경\u003c/span>\u003c/td>\u003ctd class=\"r\">the place and the time where the story happens\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">pace\u003cspan>전개 속도\u003c/span>\u003c/td>\u003ctd class=\"r\">how fast or slow the story moves\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">first-person narration\u003cspan>1인칭 시점\u003c/span>\u003c/td>\u003ctd class=\"r\">the story is told by 'I', so the reader hears one voice\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">theme\u003cspan>주제\u003c/span>\u003c/td>\u003ctd class=\"r\">the big idea under the story\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">to revise\u003cspan>퇴고하다\u003c/span>\u003c/td>\u003ctd class=\"r\">to go back to my writing and make it better\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">reserve a table\u003cspan>자리를 예약하다\u003c/span>\u003c/td>\u003ctd class=\"r\">ask them to keep a table for us\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">jet lag\u003cspan>시차 적응이 안 된 상태\u003c/span>\u003c/td>\u003ctd class=\"r\">the tired feeling after a long flight, when your body still thinks it's night\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">I'm allergic to it\u003cspan>알레르기가 있다\u003c/span>\u003c/td>\u003ctd class=\"r\">if I eat it, my body gets sick\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">refund\u003cspan>환불\u003c/span>\u003c/td>\u003ctd class=\"r\">they give me my money back\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">a coming-of-age story\u003cspan>성장소설\u003c/span>\u003c/td>\u003ctd class=\"r\">a story about a young person who grows up and changes\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"l\">the audience for this book\u003cspan>이 책의 독자층\u003c/span>\u003c/td>\u003ctd class=\"r\">the kind of people who will read this book\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch2>실전에서 지킬 다섯 가지\u003c/h2>\u003col class=\"rules\">\u003cli>\u003cb>먼저 양해를 구하고 시작하세요.\u003c/b> \"My English is not very good, so I'll go slowly.\" 이 한 문장이 상대의 속도를 바꿉니다. 부끄러운 일이 아니라 대화를 설계하는 일입니다.\u003c/li>\u003cli>\u003cb>모르면 물어보세요.\u003c/b> \"How do you say ...?\" 는 실력이 아니라 태도를 보여주는 문장입니다. 멈추는 것보다 백 배 낫습니다.\u003c/li>\u003cli>\u003cb>because 를 습관으로 만드세요.\u003c/b> 이유가 붙는 순간 문장은 두 배가 되고, 상대는 당신이 생각을 가진 사람이라고 느낍니다.\u003c/li>\u003cli>\u003cb>실패한 문장을 버리지 말고 고쳐 쓰세요.\u003c/b> \"I mean ...\" 또는 \"In other words ...\" 로 시작하면 같은 말을 한 번 더 시도할 권리가 생깁니다.\u003c/li>\u003cli>\u003cb>답하기 전에 되물으세요.\u003c/b> \"Let me see if I understand ...\" 는 오해를 막으면서 동시에 생각할 시간을 벌어줍니다. 협상 자리에서는 이게 가장 값진 문장입니다.\u003c/li>\u003c/ol>\u003cp class=\"end\">이 해설은 1단계 데이터에서 자동으로 만들어졌습니다. 다음 단계를 받으면 그 단계의 해설이 다시 만들어집니다.\u003c/p>","made":"2026-08-17"};
var KEY = 'pw-pocket/' + D.stage;
var st = load();
var tab = 'card', SESS = null, hideAll = true;

function load(){ try{ var r = localStorage.getItem(KEY); return r? JSON.parse(r) : {ng:{},ok:{},day:'',theme:'light'}; }catch(e){ return {ng:{},ok:{},day:'',theme:'light'}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function today(){ return new Date().toISOString().slice(0,10); }
var tt; function toast(m){ var t=document.getElementById('ts'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('on');},1800); }
function say(s){ if(!window.speechSynthesis) return; try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(s); u.lang='en-US'; u.rate=.9; speechSynthesis.speak(u);}catch(e){} }

/* ---- 오늘의 묶음 만들기 ---- */
function newSession(only){
  var pool = D.deck.slice();
  if(only === 'ng') pool = pool.filter(function(c){ return st.ng[c.id]; });
  else {
    pool.sort(function(a,b){
      var wa = (st.ng[a.id]?6:0) + a.w - (st.ok[a.id]||0)*2;
      var wb = (st.ng[b.id]?6:0) + b.w - (st.ok[b.id]||0)*2;
      return wb - wa || (Math.random()-.5);
    });
    pool = pool.slice(0, 24);
  }
  for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  SESS = { q: pool, i: 0, flip: false, done: 0, miss: [], total: pool.length, started: true };
  st.day = today(); save();
}

/* ---- 화면 ---- */
function render(){
  document.getElementById('stg').textContent = D.stage + '단계';
  var v = document.getElementById('v');
  if(tab === 'card') v.innerHTML = vCard();
  else if(tab === 'list') v.innerHTML = vList();
  else v.innerHTML = '<article>' + D.essay + '</article>';
  var p = document.getElementById('pg');
  p.style.width = (tab === 'card' && SESS && SESS.total ? Math.round(SESS.i / SESS.total * 100) : 0) + '%';
  window.scrollTo(0,0);
}
function vCard(){
  if(!SESS){
    var ngn = Object.keys(st.ng).length;
    return '<h1 class="serif">' + esc(D.title) + '</h1>'
     + '<p class="lead">' + esc(D.goal) + '</p>'
     + '<div class="card"><p style="margin:0 0 6px"><b>규칙은 하나입니다.</b></p>'
     + '<p class="mini" style="margin:0">뒤집기 전에 먼저 시도하세요. 소리는 내지 않아도 됩니다 — 다만 <b>입 모양으로</b> 말해야 합니다. '
     + '눈으로만 읽은 문장은 입으로 나오지 않습니다. 3초 안에 안 나오면 그건 막힌 것입니다.</p></div>'
     + '<button class="big fill" data-a="start">오늘의 24장 시작</button>'
     + (ngn ? '<button class="big" data-a="startng">막혔던 ' + ngn + '장만 다시</button>' : '')
     + '<p class="mini center" style="margin-top:18px">' + D.deck.length + '장 보유 · ' + esc(D.made) + ' 기준</p>';
  }
  if(SESS.i >= SESS.q.length){
    var m = SESS.miss.length, tot = SESS.total;
    return '<h1 class="serif">오늘 분량 끝</h1>'
     + '<div class="card center"><div style="font-size:40px;font-weight:600;letter-spacing:-.03em">' + (tot-m) + ' / ' + tot + '</div>'
     + '<p class="mini" style="margin:6px 0 0">떠올린 카드</p></div>'
     + (m ? '<button class="big fill" data-a="again">막힌 ' + m + '장 다시 돌기</button>' : '<p class="center" style="color:var(--accent)">전부 떠올렸습니다.</p>')
     + '<button class="big" data-a="start">새로 24장 뽑기</button>'
     + (Object.keys(st.ng).length ? '<button class="big" data-a="code">막힌 목록 복사 (크롬 앱에 붙여넣기)</button>' : '')
     + '<p class="mini" style="margin-top:16px">복사한 코드를 데스크톱 앱의 <b>약점 복습</b> 탭에 붙여넣으면, 여기서 막힌 것들이 입으로 하는 연습에 먼저 나옵니다.</p>';
  }
  var c = SESS.q[SESS.i];
  var h = '<div class="card" data-a="flip">';
  if(!SESS.flip){
    h += '<div class="face"><span class="tag' + (c.tag==='도구'?' d':'') + '">' + esc(c.tag) + '</span>'
      + '<div class="q serif">' + esc(c.front) + '</div>'
      + (c.sub ? '<div class="sub">' + esc(c.sub) + '</div>' : '') + '</div></div>'
      + '<p class="tapnote">입 모양으로 말해본 다음 — 화면을 탭</p>';
  } else {
    h += '<div class="face"><span class="tag' + (c.tag==='도구'?' d':'') + '">' + esc(c.tag) + '</span>'
      + '<div class="a serif">' + esc(c.back) + '</div>'
      + (c.tip ? '<div class="tip">' + esc(c.tip) + '</div>' : '') + '</div></div>'
      + '<div class="acts"><button data-a="ng">막혔다</button><button class="ok" data-a="ok">떠올렸다</button></div>'
      + '<button class="big" data-a="say">♪ 들어보기</button>';
  }
  h += '<p class="mini center" style="margin-top:14px">' + (SESS.i+1) + ' / ' + SESS.q.length + '</p>';
  return h;
}
function vList(){
  var q = (window.__q || '').trim().toLowerCase();
  function hit(a,b,c){ if(!q) return true; return ((a||'')+' '+(b||'')+' '+(c||'')).toLowerCase().indexOf(q) >= 0; }
  function row(k,e,n){ return '<div class="row" data-a="peek"><div class="k">' + esc(k) + '</div><div class="e' + (hideAll?' hide':'') + '">' + esc(e) + '</div>'
    + (n ? '<div class="n">' + esc(n) + '</div>' : '') + '</div>'; }
  var h = '<h1 class="serif">단어와 표현</h1>'
   + '<p class="lead">영어 쪽은 흐려져 있습니다. 먼저 떠올린 다음 탭해서 확인하세요.</p>'
   + '<input type="search" id="q" placeholder="한국어·영어 아무거나 검색" value="' + esc(window.__q||'') + '">'
   + '<button class="big" data-a="toggle" style="margin-top:10px">' + (hideAll ? '전부 보이기' : '전부 가리기') + '</button>';
  var tools = D.tools.filter(function(t){ return hit(t.kr,t.w,t.note); });
  if(tools.length){ h += '<div class="sec">돌려 말하기 도구</div>'; tools.forEach(function(t){ h += row(t.kr, t.w, t.note); }); }
  var pat = D.patterns.filter(function(p){ return hit(p.kr,p.en); });
  if(pat.length){ h += '<div class="sec">패턴 문장 ' + pat.length + '</div>'; pat.forEach(function(p){ h += row(p.kr, p.en); }); }
  var par = D.paraphrase.filter(function(p){ return hit(p.term,p.model,p.kr); });
  if(par.length){ h += '<div class="sec">쉬운 말로 바꾸기 ' + par.length + '</div>'; par.forEach(function(p){ h += row(p.term + (p.kr?'  ('+p.kr+')':''), p.model); }); }
  D.dialogues.forEach(function(d){
    var ts = d.turns.filter(function(t){ return hit(t.kr,t.model); });
    if(ts.length){ h += '<div class="sec">대화 · ' + esc(d.title) + '</div>'; ts.forEach(function(t){ h += row(t.kr, t.model); }); }
  });
  var core = D.core.filter(function(c){ return hit(c.kr,c.w,c.note); });
  if(core.length){ h += '<div class="sec">핵심 단어</div>'; core.forEach(function(c){ h += row(c.kr, c.w, c.note); }); }
  if(!q){ h += '<div class="sec">이 단계에서 쓸 수 있는 단어 ' + D.allowed.length + '</div><div class="chips">'
    + D.allowed.map(function(w){ return '<span>' + esc(w) + '</span>'; }).join('') + '</div>'; }
  return h;
}

/* ---- 조작 ---- */
document.addEventListener('click', function(e){
  var g = e.target.closest('[data-go]');
  if(g){ tab = g.dataset.go; [].forEach.call(document.querySelectorAll('[data-go]'), function(b){ b.classList.toggle('on', b.dataset.go===tab); }); render(); return; }
  if(e.target.id === 'th'){ st.theme = st.theme==='dark'?'light':'dark'; document.documentElement.dataset.t = st.theme; save(); return; }
  var t = e.target.closest('[data-a]'); if(!t) return;
  var a = t.dataset.a, c = SESS && SESS.q[SESS.i];
  if(a === 'start'){ newSession(); render(); }
  else if(a === 'startng'){ newSession('ng'); render(); }
  else if(a === 'again'){ var ids = SESS.miss.slice(); SESS = { q: D.deck.filter(function(x){ return ids.indexOf(x.id)>=0; }), i:0, flip:false, done:0, miss:[], total:ids.length, started:true }; render(); }
  else if(a === 'flip'){ if(SESS && !SESS.flip){ SESS.flip = true; render(); } }
  else if(a === 'ok'){ delete st.ng[c.id]; st.ok[c.id] = (st.ok[c.id]||0)+1; save(); SESS.i++; SESS.flip=false; render(); }
  else if(a === 'ng'){ st.ng[c.id] = 1; SESS.miss.push(c.id); save(); SESS.i++; SESS.flip=false; render(); }
  else if(a === 'say'){ e.stopPropagation(); say(c.back); }
  else if(a === 'toggle'){ hideAll = !hideAll; render(); }
  else if(a === 'peek'){ var el = t.querySelector('.e'); if(el) el.classList.toggle('hide'); }
  else if(a === 'code'){
    var code = 'PW/' + D.stage + '/' + Object.keys(st.ng).join(',');
    var ta = document.createElement('textarea'); ta.value = code; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    if(navigator.clipboard){ navigator.clipboard.writeText(code).then(function(){toast('복사했습니다');},function(){ try{document.execCommand('copy'); toast('복사했습니다');}catch(x){ prompt('아래를 복사하세요', code); } }); }
    else { try{ document.execCommand('copy'); toast('복사했습니다'); }catch(x){ prompt('아래를 복사하세요', code); } }
    setTimeout(function(){ ta.remove(); }, 300);
  }
});
document.addEventListener('input', function(e){ if(e.target.id==='q'){ window.__q = e.target.value; var s=e.target.selectionStart; render(); var n=document.getElementById('q'); if(n){ n.focus(); n.setSelectionRange(s,s); } } });

document.documentElement.dataset.t = st.theme || 'light';
render();
</script>
